<style>

.opt.right{border-color:var(--ok);background:var(--ok-bg)}.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}.opt:disabled{cursor:default}
.fb{margin:0;font-size:.92rem}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}

<div id="stage"><canvas id="cv" aria-label="مختبر افتراضي ثلاثي الأبعاد فيه مجهر مركب ومصباح وصندوق شرائح"></canvas></div>
<div class="top"><h1>🔬 مختبر المجهر</h1><nav class="nav" id="ms" aria-label="المهام"></nav><div id="sys" aria-label="حالة المجهر"></div></div>
<div class="card"><button class="grip" type="button" id="grip" aria-label="اسحب لتحريك البطاقة. اضغط مرتين لإعادتها إلى مكانها"><span></span><small>اسحب لتحريك البطاقة</small></button><div class="cin" id="cin" aria-live="polite"></div></div>
<div id="toast" role="status" hidden></div>
<div id="ectl" hidden aria-label="أدوات المنظر"></div>

<script>
(()=>{'use strict';document.documentElement.dir='rtl';document.documentElement.lang='ar';
const $=s=>document.querySelector(s),ar=n=>Number(n).toLocaleString('ar-SA');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=$('#cv');let cx=cv.getContext('2d');let W=0,H=0,DPR=1,CX0=0,CY0=0;
let AVH=600;const fit=()=>{DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);};
const place=()=>{const top=($('#sys')?.getBoundingClientRect().bottom||100)+8;if($('.card')?.classList.contains('moved')){CX0=W/2;AVH=H-top-10;CY0=top+AVH*.5;return;}if(W>=900){CX0=(W-400)/2;AVH=H-top-10;CY0=top+AVH*.52;}else{const b=$('.card .cin')?.getBoundingClientRect().top||H*.6;AVH=Math.max(160,b-top-6);CX0=W/2;CY0=top+AVH*.5;}};addEventListener('resize',fit);fit();

/* ===== محرّك ===== */
const cam={yaw:0,pitch:.08,dist:6.2,t:[0,1.0,0]};
const P=p=>{const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);const x=p[0]-cam.t[0],y=p[1]-cam.t[1],z=p[2]-cam.t[2];
  const x1=x*cy-z*sy,z1=x*sy+z*cy,y2=y*cp-z1*sp,z2=y*sp+z1*cp,d=cam.dist-z2,s=Math.min(W*1.05,AVH*1.18)/Math.max(d,.05);return [CX0+x1*s,CY0-y2*s,d,s];};
const LT=(()=>{const v=[-.4,.8,.6],n=Math.hypot(...v);return v.map(a=>a/n);})();
const rgb=h=>{const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];};

const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],crs=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];

const poly=(pts,c,a=1,tag=null)=>Q.push({k:'p',pts,c,a,tag});
const ball=(p,r,c,a=1,tag=null)=>Q.push({k:'s',p,r,c,a,tag});
const rod=(p,q,r,c,a=1,tag=null)=>Q.push({k:'l',p,q,r,c,a,tag});
const label=(p,t)=>LB.push({p,t});
const flush=()=>{const it=[];HIT=[];for(const o of Q){if(o.k==='p'){o.pr=o.pts.map(P);o.d=o.pr.reduce((s,v)=>s+v[2],0)/o.pr.length;if(o.far)o.d=1e9+(o.far||0);const nn=crs(sub(o.pts[1],o.pts[0]),sub(o.pts[2],o.pts[0])),L=Math.hypot(...nn)||1;o.sh=.62+.45*Math.abs((nn[0]*LT[0]+nn[1]*LT[1]+nn[2]*LT[2])/L);}
    else if(o.k==='s'){o.pr=P(o.p);o.d=o.pr[2];}else{o.pa=P(o.p);o.pb=P(o.q);o.d=(o.pa[2]+o.pb[2])/2;}it.push(o);}
  it.sort((a,b)=>b.d-a.d);
  for(const o of it){cx.globalAlpha=o.a;let h=null;
    if(o.k==='p'){cx.beginPath();o.pr.forEach((v,i)=>i?cx.lineTo(v[0],v[1]):cx.moveTo(v[0],v[1]));cx.closePath();cx.fillStyle=col(o.c,o.sh);cx.fill();if(o.tag)h={tag:o.tag,poly:o.pr};}
    else if(o.k==='s'){const [x,y,,s]=o.pr,r=Math.max(.5,o.r*s);const g=cx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);g.addColorStop(0,col(o.c,1.45));g.addColorStop(.6,col(o.c,1));g.addColorStop(1,col(o.c,.6));cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r,0,7);cx.fill();if(o.tag)h={tag:o.tag,c:[x,y,r+3]};}
    else{const w=Math.max(1.2,o.r*(o.pa[3]+o.pb[3]));cx.strokeStyle=col(o.c,1);cx.lineCap='round';cx.lineWidth=w;cx.beginPath();cx.moveTo(o.pa[0],o.pa[1]);cx.lineTo(o.pb[0],o.pb[1]);cx.stroke();if(o.tag)h={tag:o.tag,seg:[o.pa,o.pb,w/2+5]};}
    if(h)HIT.push(h);}
  cx.globalAlpha=1;Q=[];
  cx.font='600 12.5px "IBM Plex Sans Arabic",system-ui,sans-serif';cx.direction='rtl';cx.textBaseline='middle';cx.textAlign='center';
  for(const l of LB){const [x,y]=P(l.p);const w=cx.measureText(l.t).width+14,lx=Math.min(W-w/2-6,Math.max(w/2+6,x)),ly=y-22;cx.strokeStyle='rgba(255,255,255,.8)';cx.lineWidth=1.2;cx.beginPath();cx.moveTo(x,y);cx.lineTo(lx,ly+10);cx.stroke();
    cx.fillStyle='rgba(30,14,18,.88)';cx.beginPath();cx.roundRect?cx.roundRect(lx-w/2,ly-11,w,22,8):cx.rect(lx-w/2,ly-11,w,22);cx.fill();cx.fillStyle='#FBEFF1';cx.fillText(l.t,lx,ly);}LB=[];};
const ellip=(c,rx,ry,rz,colr,a,tag,NU=6,NV=10,rot=0)=>{const cr=Math.cos(rot),sr=Math.sin(rot);const S=(u,v)=>{const x=rx*Math.sin(u)*Math.cos(v),y=ry*Math.cos(u),z=rz*Math.sin(u)*Math.sin(v);return [c[0]+x*cr-y*sr,c[1]+x*sr+y*cr,c[2]+z];};
  for(let i=0;i<NU;i++)for(let j=0;j<NV;j++){const u0=i/NU*Math.PI,u1=(i+1)/NU*Math.PI,v0=j/NV*2*Math.PI,v1=(j+1)/NV*2*Math.PI;poly([S(u0,v0),S(u1,v0),S(u1,v1),S(u0,v1)],colr,a,tag);}};
const tube=(path,r,c,a,tag)=>{for(let i=0;i<path.length-1;i++)rod(path[i],path[i+1],r,c,a,tag);};
const along=(path,t)=>{const L=[0];for(let i=1;i<path.length;i++)L.push(L[i-1]+Math.hypot(...sub(path[i],path[i-1])));const T=Math.max(0,Math.min(1,t))*L[L.length-1];let i=1;while(i<L.length-1&&L[i]<T)i++;const k=(T-L[i-1])/((L[i]-L[i-1])||1);return path[i-1].map((v,j)=>v+(path[i][j]-v)*k);};
const HR=(i,k=1)=>{const v=Math.sin(i*12.9898+k*78.233)*43758.5453;return v-Math.floor(v);};
/* ===== مختبر المجهر ===== */
const S={st:0,sel:null,seen:new Set(),quiz:null,qi:0,qwrong:0,done:[0,0,0,0],
  src:null,light:0,mir:0,slide:null,slideT:1,clip:0,obj:'high',rot:Math.PI,eye:0,focus:20,
  set:{},wrongs:0,cur:null,smp:{},names:0,sort:{},pick:null,q1:0,q2:0,drag:0};
const norm=v=>{const l=Math.hypot(...v)||1;return v.map(x=>x/l);};
const lerp=(a,b,t)=>a+(b-a)*t;
function cub(c,s,colr,a=1,tag=null,far=0){const [hx,hy,hz]=s.map(v=>v/2);const v=(i,j,k)=>[c[0]+i*hx,c[1]+j*hy,c[2]+k*hz];
  (far?(p=>Q.push({k:'p',pts:p,c:colr,a,tag,far})):(p=>poly(p,colr,a,tag)))([v(-1,1,-1),v(1,1,-1),v(1,1,1),v(-1,1,1)]);poly([v(-1,-1,1),v(1,-1,1),v(1,1,1),v(-1,1,1)],colr,a,tag);poly([v(-1,-1,-1),v(1,-1,-1),v(1,1,-1),v(-1,1,-1)],colr,a,tag);
  poly([v(-1,-1,-1),v(-1,-1,1),v(-1,1,1),v(-1,1,-1)],colr,a,tag);poly([v(1,-1,-1),v(1,-1,1),v(1,1,1),v(1,1,-1)],colr,a,tag);}
function cyl(a,b,r,colr,tag=null,N=14,r2=r,al=1){const ax=sub(b,a),n=norm(ax);const t=Math.abs(n[1])<.9?[0,1,0]:[1,0,0];const u=norm(crs(n,t)),v=crs(n,u);
  const pt=(k,rr,base)=>{const an=k/N*6.2832;return base.map((x,j)=>x+(u[j]*Math.cos(an)+v[j]*Math.sin(an))*rr);};
  for(let k=0;k<N;k++)poly([pt(k,r,a),pt(k+1,r,a),pt(k+1,r2,b),pt(k,r2,b)],colr,al,tag);
  const ca=[],cb=[];for(let k=0;k<N;k++){ca.push(pt(k,r,a));cb.push(pt(k,r2,b));}poly(ca,colr,al,tag);poly(cb,colr,al,tag);}
const hl=k=>S.sel===k||(S.hint===k&&Math.sin(performance.now()/180)>0);
const C=(k,c)=>hl(k)?'#FFD43B':c;

/* ===== البطاقة ===== */
const STN=['أتعرّف المجهر','أجهّز المجهر','أفحص العينات','أقارن وأستنتج'];
const SRC='📖 كتاب العلوم للصف السادس: المجهر المركب ص١٩٢ · كيف تبدو الخلايا؟ ص٢٣ · فيمَ تختلف الخلايا النباتية عن الخلايا الحيوانية؟ ص٣٣ · إعداد وتصميم: أ. خالد رفيع الحمدي';
function nav(){$('#ms').innerHTML=STN.map((n,i)=>`<button type="button" class="${i===S.st?'on':S.done[i]?'done':''}" data-st="${i}">${S.done[i]?'✓ ':ar(i+1)+'. '}${n}</button>`).join('');
  $('#ms').querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>open(+b.dataset.st));
  $('#sys').innerHTML=`<button type="button" class="${S.light&&S.mir>.95?'on':''}" tabindex="-1">💡 ${S.light&&S.mir>.95?'الضوء على المنضدة':'لا ضوء'}</button><button type="button" class="${S.slide?'on':''}" tabindex="-1">🔬 ${S.slide?SM[S.slide].n:'لا شريحة'}</button><button type="button" class="on" tabindex="-1">🔍 ${S.obj==='high'?'القوة الكبرى':'القوة الصغرى'}</button>`;}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>e.hidden=true,2200);}
function open(i){S.st=i;S.sel=null;S.hint=null;S.wrongs=0;if(i>=2)autoSetup();if(i<2)setEye(0);nav();render();$('#cin').scrollTop=0;}
function render(){[r0,r1,r2,r3][S.st]();}
function head(k,h,lead){return `<p class="kick">المحطة ${ar(S.st+1)} من ٤ · ${k}</p><h2>${h}</h2>${lead?`<p class="lead">${lead}</p>`:''}`;}
const fbx=(id)=>`<p class="fb" id="${id}" aria-live="polite"></p>`;
function say(id,ok,t){const f=$('#'+id);if(!f)return;f.className='fb '+(ok?'ok':'bad');f.innerHTML=t;}

/* المحطة ١ */
function r0(){const c=$('#cin');
  if(S.quiz){const k=S.quiz[S.qi];
    c.innerHTML=head('اختبر نفسك','أين '+ORG[k].n+'؟','')+`<p class="pulse">اضغط في المجسّم على: <b>${ORG[k].n}</b></p>
     <div class="dots">${S.quiz.map((_,i)=>`<i class="${i<S.qi?'d':i===S.qi?'c':''}"></i>`).join('')}<span>${ar(S.qi+1)}/${ar(S.quiz.length)}</span></div>${fbx('f0')}<p class="src">${SRC}</p>`;return;}
  c.innerHTML=head('استكشاف','المجهر المركّب','المجهر أداة تستخدم مجموعة عدسات لتكبير الأشياء أو صورها لتبدو أكبر حجمًا، ويكبّر الأشياء مئات أو آلاف المرات. اضغط على أي جزء في المجسّم لتعرف اسمه وعمله، ويمكنك تدوير المجسّم بالسحب.')+
   (S.sel?`<p class="info"><b>${ORG[S.sel].n}</b>${ORG[S.sel].d}</p>`:'')+
   `<p class="small">تعرّفت <b>${ar(S.seen.size)}</b> من ${ar(OK.length)} أجزاء.</p><div class="chips">${OK.map(k=>`<button type="button" class="obtn ${S.sel===k?'sel':S.seen.has(k)?'got':''}" data-org="${k}">${S.seen.has(k)?'✓ ':''}${ORG[k].n}</button>`).join('')}</div>
   <button class="go" type="button" id="qz" ${S.seen.size<OK.length?'disabled':''}>اختبر نفسك ←</button>${S.seen.size<OK.length?'<p class="hint2">تعرّف الأجزاء كلها أولًا ليبدأ الاختبار.</p>':''}<p class="src">${SRC}</p>`;
  c.querySelectorAll('[data-org]').forEach(b=>b.onclick=()=>pickPart(b.dataset.org));
  $('#qz').onclick=()=>{S.quiz=[...OK].sort((a,b)=>HR(a.length*7+a.charCodeAt(0),2)-HR(b.length*7+b.charCodeAt(0),2));S.qi=0;S.sel=null;S.qwrong=0;r0();};}
function pickPart(k){S.sel=k;S.seen.add(k);r0();}
function quizTap(k){const want=S.quiz[S.qi];
  if(k===want){S.qi++;S.qwrong=0;S.hint=null;S.sel=k;if(S.qi>=S.quiz.length){S.quiz=null;S.done[0]=1;nav();const c=$('#cin');
      c.innerHTML=head('أحسنت','عرفت أجزاء المجهر كلها!','وجدت الأجزاء الثمانية: العدسة العينية، والعدسات الشيئية، والضابطين، والذراع، والضاغطين، والمنضدة، والمرآة، والقاعدة.')+`<button class="go" type="button" id="nx">التالي: أجهّز المجهر ←</button><p class="src">${SRC}</p>`;$('#nx').onclick=()=>open(1);return;}
    r0();say('f0',1,'صحيح: '+ORG[k].n+'. '+ORG[k].d);return;}
  S.qwrong++;S.sel=k;say('f0',0,`هذا «${ORG[k].n}»: ${ORG[k].d}<br>ابحث عن <b>${ORG[want].n}</b>: ${ORG[want].h}.`);if(S.qwrong>=2)S.hint=want;}

/* المحطة ٢: خطوات استخدام المجهر */
const SET=[['light','أوجّه المرآة نحو مصدر الضوء'],['slide','أضع شريحة الفلين على المنضدة'],['clip','أثبّت الشريحة بالضاغطين'],['low','أبدأ بقوة التكبير الصغرى'],['look','أنظر من خلال العدسة العينية، وأحرّك الضابط حتى أرى بوضوح']];
function r1(){const c=$('#cin'),cur=SET.findIndex(([k])=>!S.set[k]);
  if(cur<0){S.done[1]=1;nav();c.innerHTML=head('أحسنت','المجهر جاهز!','ترى الآن مقطع الفلين بوضوح بقوة التكبير الصغرى. هكذا نستخدم المجهر: الضوء، ثم الشريحة، ثم القوة الصغرى، ثم الضابط.')+
    `<ol class="chk">${SET.map(([k,n])=>`<li class="ok">✓ ${n}</li>`).join('')}</ol><button class="go" type="button" id="nx">التالي: أفحص العينات ←</button><p class="src">${SRC}</p>`;$('#nx').onclick=()=>open(2);return;}
  let extra='';
  if(SET[cur][0]==='light'&&!S.src)extra=`<p class="step">نحتاج إلى ضوء. نحو أي مصدر أوجّه المرآة؟</p><div class="opts"><button class="opt" type="button" data-src="lamp">💡 نحو مصباح المختبر</button><button class="opt" type="button" data-src="sun">☀️ نحو الشمس من النافذة</button></div>`;
  else if(SET[cur][0]==='light')extra='<p class="pulse">الآن اضغط على <b>المرآة</b> في المجسّم لتحرّكها حتى تعكس الضوء على المنضدة.</p>';
  else if(SET[cur][0]==='slide')extra='<p class="pulse">اضغط على شريحة <b>مقطع من الفلين</b> في صندوق الشرائح.</p>';
  else if(SET[cur][0]==='clip')extra='<p class="pulse">اضغط على الجزء الذي يثبّت الشريحة على المنضدة.</p>';
  else if(SET[cur][0]==='low')extra='<p class="pulse">العدسة الشيئية المستخدمة الآن هي الكبرى (الطويلة). اضغط على <b>العدسات الشيئية</b> لتدويرها إلى القوة الصغرى.</p>';
  else extra=S.eye?'<p class="pulse">حرّك <b>الضابط</b> أسفل المنظر حتى تصبح الصورة واضحة.</p>':'<p class="pulse">اضغط على الجزء الذي تنظر من خلاله.</p>';
  c.innerHTML=head('أجرّب','أجهّز المجهر خطوة بخطوة','نفّذ الخطوات كما في الكتاب. اضغط على الأجزاء في المجسّم.')+
   `<ol class="chk">${SET.map(([k,n],i)=>`<li class="${S.set[k]?'ok':i===cur?'cur':''}">${S.set[k]?'✓ ':ar(i+1)+'. '}${n}</li>`).join('')}</ol>${extra}${fbx('f1')}<button class="tb" type="button" id="hlp">لم أجد الجزء؟ أرني</button><p class="src">${SRC}</p>`;
  c.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{if(b.dataset.src==='sun'){b.classList.add('wrong');say('f1',0,'⚠ <b>أحذر:</b> لا أوجّه المرآة نحو الشمس أو نحو مصدر ضوء قوي؛ فقد يؤدي ذلك إلى ضرر دائم بالعين. اختر مصدرًا آمنًا.');}else{S.src='lamp';r1();}});
  $('#hlp').onclick=()=>{const m={light:'mirror',slide:null,clip:'clip',low:'obj',look:S.eye?null:'eye'}[SET[cur][0]];if(SET[cur][0]==='slide'){S.hint='sl:cork';toast('شريحة الفلين في صندوق الشرائح أمام المجهر');}else if(m){S.hint=m;toast(ORG[m].n+': '+ORG[m].h);}else toast('استخدم شريط «الضابط» أسفل المنظر');};}
function setupTap(k){const cur=SET.findIndex(([x])=>!S.set[x]);if(cur<0)return;const step=SET[cur][0];const bad=t=>{S.wrongs++;say('f1',0,t);if(S.wrongs>=2){S.hint={light:'mirror',slide:'sl:cork',clip:'clip',low:'obj',look:'eye'}[step];}};
  if(k==='mirror'){if(step==='light'){if(!S.src){bad('اختر أولًا مصدر الضوء الذي ستوجّه نحوه المرآة.');return;}S.light=1;S.set.light=1;S.mir=0;S.wrongs=0;S.hint=null;anim('mir',1);toast('انعكس الضوء من المرآة إلى الثقب في وسط المنضدة');nav();r1();return;}toast('المرآة تعكس الضوء على المنضدة بالفعل');return;}
  if(k.startsWith('sl:')){const s=k.slice(3);if(step==='light'){bad('قبل وضع الشريحة: نحتاج إلى ضوء يصل إلى المنضدة. ما الجزء الذي يعكس الضوء؟');return;}
    if(s!=='cork'){bad(`هذه شريحة «${SM[s].n}». في هذه الخطوة نفحص <b>شريحة جاهزة لمقطع من الفلين</b> كما في نشاط الكتاب ص٢٣.`);return;}
    if(step==='slide'){S.slide='cork';S.slideT=0;anim('slideT',1);S.set.slide=1;S.wrongs=0;S.hint=null;toast('وُضعت الشريحة على المنضدة فوق الثقب');nav();r1();}return;}
  if(k==='clip'){if(!S.slide){bad('لا توجد شريحة على المنضدة بعد لتثبيتها. ضع شريحة الفلين أولًا.');return;}if(step==='clip'){S.clip=1;S.set.clip=1;S.wrongs=0;S.hint=null;toast('ثبّت الضاغطان الشريحة');r1();}return;}
  if(k==='obj'){if(cur<3){bad('ليس بعد. أكمل الخطوة '+ar(cur+1)+': '+SET[cur][1]+'.');return;}if(step==='low'){switchObj('low');S.set.low=1;S.wrongs=0;S.hint=null;r1();}return;}
  if(k==='eye'){if(!S.light){bad('إذا نظرت الآن فسترى المنظر مظلمًا؛ لم يصل الضوء إلى المنضدة بعد.');return;}if(!S.slide){bad('لا توجد شريحة على المنضدة؛ لن ترى إلا دائرة مضيئة فارغة.');return;}
    if(!S.clip){bad('ثبّت الشريحة بالضاغطين أولًا حتى لا تتحرك.');return;}if(!S.set.low){bad('نبدأ دائمًا بقوة التكبير الصغرى. أدر العدسات الشيئية أولًا.');return;}S.wrongs=0;S.hint=null;setEye(1);r1();return;}
  if(k==='knob'&&!S.eye){say('f1',0,'الضابطان يوضّحان الصورة، لكن أكمل أولًا: '+SET[cur][1]+'.');return;}
  bad(`هذا «${ORG[k].n}». الخطوة الآن: ${SET[cur][1]}.`);}
function onFocus(){if(S.st===1&&S.eye&&S.set.low&&!S.set.look&&clear()){S.set.look=1;toast('واضحة! هذه خلايا الفلين');setTimeout(r1,500);}if(S.st===2)checkSample();}
const clear=()=>S.slide&&Math.abs(S.focus-(SM[S.slide].f+(S.obj==='high'?9:0)))<5;

/* المحطة ٣: فحص العينات */
function autoSetup(){if(!S.light){S.light=1;S.src='lamp';S.mir=1;}S.set={light:1,slide:1,clip:1,low:1,look:1};if(!S.slide){S.slide='cork';S.slideT=1;S.obj='low';S.rot=0;}S.clip=1;}
function curS(){return S.smp[S.slide]||(S.smp[S.slide]={lo:0,hi:0,ok:0,tries:0});}
function r2(){const c=$('#cin'),k=S.slide,st=k?curS():null,all=SK.every(x=>S.smp[x]&&S.smp[x].ok);if(all&&!S.done[2]){S.done[2]=1;nav();}
  let body='';
  if(!k)body='<p class="pulse">اختر شريحة من الصندوق.</p>';
  else{body=`<p class="info"><b>${SM[k].s}</b></p><ol class="chk"><li class="${st.lo?'ok':'cur'}">${st.lo?'✓':'١.'} أرى العينة بوضوح بقوة التكبير الصغرى</li><li class="${st.hi?'ok':st.lo?'cur':''}">${st.hi?'✓':'٢.'} أنتقل إلى القوة الكبرى وأحرّك الضابط حتى أرى بوضوح</li></ol>`;
    if(!S.eye)body+='<button class="go" type="button" id="look">👁 أنظر من خلال العدسة العينية</button>';
    if(st.hi){body+=`<p class="step">${SM[k].q}</p><div class="opts">${SM[k].o.map((o,i)=>`<button class="opt ${st.ok&&o[1]?'right':''}" type="button" data-o="${i}" ${st.ok?'disabled':''}>${o[0]}</button>`).join('')}</div>${fbx('f2')}`;
      if(st.ok)body+=`<label class="row small"><input type="checkbox" id="nm" ${S.names?'checked':''}> أظهر أسماء الأجزاء على المنظر (بالقوة الكبرى)</label>`;}}
  const nxt=SK.find(x=>!(S.smp[x]&&S.smp[x].ok));
  c.innerHTML=head('أستكشف','أفحص العينات بالمجهر','اختر شريحة، ثم افحصها بقوة التكبير الصغرى ثم الكبرى، ودوّن ملاحظتك.')+
   `<div class="chips">${SK.map(x=>`<button type="button" class="obtn ${S.slide===x?'sel':S.smp[x]&&S.smp[x].ok?'got':''}" data-s="${x}">${S.smp[x]&&S.smp[x].ok?'✓ ':''}${SM[x].n}</button>`).join('')}</div>${body}
   ${st&&st.ok&&nxt?`<button class="go" type="button" id="nxs">العينة التالية: ${SM[nxt].n} ←</button>`:''}${all?'<button class="go" type="button" id="nx">التالي: أقارن وأستنتج ←</button>':''}
   <details class="tbl"${Object.values(S.smp).some(v=>v.ok)?' open':''}><summary>📋 جدول ملاحظاتي (${ar(SK.filter(x=>S.smp[x]&&S.smp[x].ok).length)}/٦)</summary><table><tr><th>العينة</th><th>ماذا رأيت؟</th></tr>${SK.map(x=>`<tr><td>${SM[x].n}</td><td>${S.smp[x]&&S.smp[x].ok?SM[x].rec:'—'}</td></tr>`).join('')}</table></details><p class="src">${SRC}</p>`;
  c.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>putSlide(b.dataset.s));
  const lk=$('#look');if(lk)lk.onclick=()=>setEye(1);const nx=$('#nx');if(nx)nx.onclick=()=>open(3);const ns=$('#nxs');if(ns)ns.onclick=()=>putSlide(nxt);
  const nm=$('#nm');if(nm)nm.onchange=()=>{S.names=nm.checked?1:0;if(S.names&&S.obj!=='high')toast('انتقل إلى القوة الكبرى لترى الأسماء');};
  c.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const o=SM[k].o[+b.dataset.o];if(o[1]){st.ok=1;S.names=1;r2();say('f2',1,o[2]);nav();}else{st.tries++;b.classList.add('wrong');b.disabled=true;say('f2',0,o[2]);}});}
function putSlide(k){if(S.slide===k){setEye(1);return;}S.slide=k;S.slideT=0;anim('slideT',1);S.clip=1;switchObj('low',1);S.focus=Math.max(0,Math.min(100,SM[k].f+(HR(k.length,4)>.5?22:-22)));syncFocus();S.names=0;setEye(1);nav();r2();$('#cin').scrollTop=0;}
function checkSample(){if(!S.slide)return;const st=curS(),cl=clear();let ch=0;if(cl&&S.obj==='low'&&!st.lo){st.lo=1;ch=1;toast('واضحة بالقوة الصغرى! الآن انتقل إلى القوة الكبرى');}
  if(cl&&S.obj==='high'&&st.lo&&!st.hi){st.hi=1;ch=1;toast('واضحة بالقوة الكبرى! أجب عن سؤال الملاحظة');}
  if(cl&&S.obj==='high'&&!st.lo){toast('ابدأ بالقوة الصغرى أولًا، ثم انتقل إلى الكبرى');}if(ch)r2();}
function stationTap(k){if(k.startsWith('sl:')){putSlide(k.slice(3));return;}if(k==='obj'){switchObj(S.obj==='low'?'high':'low');return;}if(k==='eye'){setEye(1);return;}if(k==='mirror'){toast('المرآة تعكس الضوء على المنضدة');return;}S.sel=k;toast(ORG[k].n+': '+ORG[k].d);}

/* المحطة ٤ */
const BINS={plant:'خلايا نباتية',animal:'خلايا حيوانية',uni:'مخلوق وحيد الخلية',none:'ليست خلايا'};
const ANS={cork:'plant',onion:'plant',elodea:'plant',cheek:'animal',pond:'uni',salt:'none'};
const WHY={cork:{animal:'الفلين يُؤخذ من لحاء شجرة، فمصدره نباتي. وقد رأيت فيه جدران خلايا تشبه خلايا النحل.',uni:'الفلين ليس مخلوقًا واحدًا يسبح؛ إنه مقطع فيه خلايا كثيرة متراصّة.',none:'رأيت في الفلين جدران خلايا متراصّة؛ فهو يتكوّن من خلايا مصدرها نبات.'},
 onion:{animal:'خلايا البصل لها جدار خلوي، والجدار الخلوي يوجد في الخلايا النباتية.',uni:'بشرة البصل فيها خلايا كثيرة متراصّة، لا خلية واحدة تعيش وحدها.',none:'رأيت في بشرة البصل جدرانًا خلوية وأنوية؛ فهي خلايا.'},
 elodea:{animal:'خلايا الإلوديا فيها جدار خلوي وبلاستيدات خضراء، ولا توجد هذه في الخلايا الحيوانية.',uni:'ورقة الإلوديا فيها خلايا كثيرة متلاصقة؛ فالنبات عديد الخلايا.',none:'رأيت في الإلوديا جدرانًا خلوية وبلاستيدات خضراء؛ فهي خلايا.'},
 cheek:{plant:'خلايا باطن الخد ليس لها جدار خلوي ولا بلاستيدات خضراء؛ وهي من جسم الإنسان.',uni:'خلايا باطن الخد جزء من جسم الإنسان العديد الخلايا، ولا تعيش كل منها وحدها.',none:'رأيت في خلايا باطن الخد نواة وغشاء بلازميًّا؛ فهي خلايا.'},
 pond:{plant:'البراميسيوم يتحرك في الماء، وجسمه كله خلية واحدة؛ فهو مخلوق وحيد الخلية.',animal:'البراميسيوم ليس جزءًا من جسم حيوان؛ جسمه كله خلية واحدة تعيش وحدها في الماء.',none:'البراميسيوم مخلوق حي يتحرك ويتغذى، وجسمه خلية واحدة.'},
 salt:{plant:'الملح ليس مخلوقًا حيًّا؛ فلا يتكوّن من خلايا.',animal:'الملح ليس مخلوقًا حيًّا؛ فلا يتكوّن من خلايا.',uni:'حبيبة الملح لا تتغذى ولا تتحرك ولا تتكاثر؛ فهي ليست مخلوقًا حيًّا.'}};
const Q1=['عندما انتقلت من قوة التكبير الصغرى إلى القوة الكبرى، ماذا لاحظت؟',[['رأيت عددًا أقل من الخلايا، لكنها أكبر وتفاصيلها أوضح',1,'صحيح! القوة الكبرى تكبّر جزءًا أصغر من العينة؛ فنرى خلايا أقل عددًا، لكن بتفاصيل أكثر.'],['رأيت عددًا أكبر من الخلايا وأصغر حجمًا',0,'هذا ما يحدث عند القوة الصغرى. تذكّر منظر الفلين: كم خلية رأيت بالقوة الكبرى؟'],['لم يتغير شيء في المنظر',0,'عُد إلى الفلين وجرّب: قارن المنظر بالقوتين. ماذا يحدث لحجم الخلايا وعددها؟']]];
const Q2=['قارن خلايا ورقة الإلوديا بخلايا باطن الخد: ما الذي وجدته في خلايا الإلوديا ولم تجده في خلايا باطن الخد؟',[['الجدار الخلوي والبلاستيدات الخضراء',1,'صحيح! الجدار الخلوي والبلاستيدات الخضراء توجد في الخلايا النباتية ولا توجد في الخلايا الحيوانية. أما النواة والسيتوبلازم والغشاء البلازمي فتوجد في النوعين.'],['النواة',0,'النواة موجودة في الخليتين: رأيتها في خلايا الإلوديا وفي خلايا باطن الخد.'],['السيتوبلازم',0,'السيتوبلازم موجود في الخليتين كلتيهما. ابحث عن تركيب رأيته في الإلوديا فقط.']]];
function r3(){const c=$('#cin'),sorted=SK.every(k=>S.sort[k]===ANS[k]);
  let h=head('أقارن وأستنتج','أصنّف ما رأيته','اختر عينة، ثم اختر المجموعة التي تنتمي إليها.')+
   `<div class="chips">${SK.filter(k=>S.sort[k]!==ANS[k]).map(k=>`<button type="button" class="obtn ${S.pick===k?'sel':''}" data-pk="${k}">${SM[k].n}</button>`).join('')||'<span class="got">✓ صنّفت العينات كلها</span>'}</div>
   <div class="bins">${Object.entries(BINS).map(([b,n])=>`<button type="button" class="bin" data-b="${b}"><b>${n}</b><span>${SK.filter(k=>S.sort[k]===b&&ANS[k]===b).map(k=>SM[k].n).join('، ')||'—'}</span></button>`).join('')}</div>${fbx('f3')}`;
  if(sorted){h+=qblock(Q1,'q1');if(S.q1)h+=qblock(Q2,'q2');}
  if(S.q1&&S.q2){S.done[3]=1;nav();h+=`<p class="rule"><b>أستنتج</b>الخلايا هي الوحدات الأساسية للتركيب والوظيفة في المخلوقات الحية جميعها. والمجهر هو الأداة التي مكّنتنا من رؤيتها: خلايا نباتية لها جدار خلوي (وفي الأوراق بلاستيدات خضراء)، وخلايا حيوانية يحيط بها غشاء بلازمي، ومخلوقات وحيدة الخلية مثل البراميسيوم.</p><p class="info"><b>🎉 أنهيت مختبر المجهر</b>أنهيت المحطات الأربع. أحسنت!</p>`;}
  c.innerHTML=h+`<p class="src">${SRC}</p>`;
  c.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{S.pick=b.dataset.pk;r3();});
  c.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{if(!S.pick){say('f3',0,'اختر عينة أولًا من الأعلى.');return;}const k=S.pick,bb=b.dataset.b;
    if(ANS[k]===bb){S.sort[k]=bb;S.pick=null;r3();say('f3',1,`صحيح: ${SM[k].n} ← ${BINS[bb]}.`);}else{say('f3',0,`ليست «${BINS[bb]}». ${WHY[k][bb]}`);}});
  c.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const [qn,i]=b.dataset.q.split(':'),Qx=qn==='q1'?Q1:Q2,o=Qx[1][+i];if(o[1]){S[qn]=1;r3();say('f'+qn,1,o[2]);}else{b.classList.add('wrong');b.disabled=true;say('f'+qn,0,o[2]);}});}
function qblock(Qx,id){return `<p class="step">${Qx[0]}</p><div class="opts">${Qx[1].map((o,i)=>`<button class="opt ${S[id]&&o[1]?'right':''}" type="button" data-q="${id}:${i}" ${S[id]?'disabled':''}>${o[0]}</button>`).join('')}</div>${fbx('f'+id)}`;}

/* أدوات */
const AN={};function anim(k,to){AN[k]={from:S[k],to,t0:performance.now()};}
function switchObj(o,quiet){if(S.obj===o)return;S.obj=o;anim('rot',o==='low'?0:Math.PI);if(!quiet)toast(o==='low'?'العدسة الشيئية الصغرى: قوة التكبير الصغرى':'العدسة الشيئية الكبرى: قوة التكبير الكبرى');nav();syncObj();if(S.st===2)checkSample();}
function setEye(on){S.eye=on?1:0;$('#ectl').hidden=!S.eye;syncObj();syncFocus();if(S.st===1&&on)r1();if(S.st===2&&on)r2();}
function syncObj(){document.querySelectorAll('#ectl [data-ob]').forEach(b=>{b.classList.toggle('on',b.dataset.ob===S.obj);b.setAttribute('aria-pressed',b.dataset.ob===S.obj);});}
function syncFocus(){const f=$('#fk');if(f)f.value=S.focus;}
function tap(x,y){if(S.eye)return;const k=tagAt(x,y);if(!k)return;
  if(S.st===0){if(!ORG[k])return;if(S.quiz){quizTap(k);return;}pickPart(k);return;}
  if(S.st===1){setupTap(k);return;}
  if(S.st===2){stationTap(k);return;}
  if(ORG[k]){S.sel=k;toast(ORG[k].n+': '+ORG[k].d);}}
function tagAt(x,y){const inP=(p)=>{let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){if(((p[i][1]>y)!==(p[j][1]>y))&&(x<(p[j][0]-p[i][0])*(y-p[i][1])/(p[j][1]-p[i][1])+p[i][0]))c=!c;}return c;};
  const dS=(a,b)=>{const vx=b[0]-a[0],vy=b[1]-a[1],t=Math.max(0,Math.min(1,((x-a[0])*vx+(y-a[1])*vy)/((vx*vx+vy*vy)||1)));return Math.hypot(x-a[0]-vx*t,y-a[1]-vy*t);};
  for(let i=HIT.length-1;i>=0;i--){const h=HIT[i];const ok=h.poly?inP(h.poly):h.c?Math.hypot(x-h.c[0],y-h.c[1])<h.c[2]:dS(h.seg[0],h.seg[1])<h.seg[2];if(ok)return h.tag;}return null;}
const ptr=new Map();let moved=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;});
cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId)||S.eye)return;const [px,py]=ptr.get(e.pointerId);const dx=e.clientX-px,dy=e.clientY-py;moved+=Math.abs(dx)+Math.abs(dy);ptr.set(e.pointerId,[e.clientX,e.clientY]);cam.yaw-=dx*.008;cam.pitch=Math.max(-.2,Math.min(1.1,cam.pitch+dy*.006));S.drag=performance.now();});
cv.addEventListener('pointerup',e=>{ptr.delete(e.pointerId);if(moved<6)tap(e.clientX,e.clientY);});cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
let ZF=1;cv.addEventListener('wheel',e=>{e.preventDefault();ZF=Math.max(.6,Math.min(1.6,ZF*(1+Math.sign(e.deltaY)*.07)));},{passive:false});
/* شريط المنظر */
$('#ectl').innerHTML=`<div class="seg"><button type="button" data-ob="low">القوة الصغرى</button><button type="button" data-ob="high">القوة الكبرى</button></div>
 <label class="fk"><span>⚙ الضابط</span><button type="button" class="fs" data-fs="-3" aria-label="تحريك الضابط قليلًا للخلف">−</button><input type="range" id="fk" min="0" max="100" step="1" aria-label="الضابط: حرّكه حتى ترى العينة بوضوح"><button type="button" class="fs" data-fs="3" aria-label="تحريك الضابط قليلًا للأمام">+</button></label>
 <button type="button" class="cls" id="ecl" aria-label="أبعد عيني عن المجهر">✕<span class="wide"> أبعد عيني</span></button>`;
$('#ectl').querySelectorAll('[data-ob]').forEach(b=>b.onclick=()=>{if(S.st===1&&!S.set.look&&b.dataset.ob==='high'){toast('نبدأ بالقوة الصغرى أولًا');return;}switchObj(b.dataset.ob);});
$('#fk').oninput=e=>{S.focus=+e.target.value;onFocus();};
$('#ectl').querySelectorAll('[data-fs]').forEach(b=>b.onclick=()=>{S.focus=Math.max(0,Math.min(100,S.focus+ +b.dataset.fs));syncFocus();onFocus();});
$('#ecl').onclick=()=>setEye(0);
/* الحلقة */
const camT={t:[-.25,.9,.25],dist:4.9,pitch:.34};cam.t=[...camT.t];cam.dist=4.9;cam.pitch=.32;cam.yaw=-.7;
function frame(ms){place();const now=performance.now();
  for(const k in AN){const a=AN[k],u=Math.min(1,(now-a.t0)/(reduce?1:700)),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;S[k]=a.from+(a.to-a.from)*e;if(u>=1)delete AN[k];}
  const mob=W<600?.82:1;cam.dist+=(camT.dist*ZF*mob-cam.dist)*.08;
  cx.setTransform(DPR,0,0,DPR,0,0);const g=cx.createRadialGradient(CX0,CY0,50,CX0,CY0,Math.max(W,H));g.addColorStop(0,'#3B4A5A');g.addColorStop(1,'#141B24');cx.fillStyle=g;cx.fillRect(0,0,W,H);
  const idle=!S.drag||now-S.drag>2500;if(idle&&!reduce)cam.yaw+=(Math.sin(ms/5000)*.3-.7-cam.yaw)*.01;
  const t=ms/1000;scene(t);
  if(S.sel&&ORG[S.sel])label(ORG[S.sel].at,ORG[S.sel].n);if(typeof S.hint==='string'&&ORG[S.hint])label(ORG[S.hint].at,ORG[S.hint].n);
  if(S.hint==='sl:cork'){const p=TRAY('cork');label([p[0],p[1]+.02,p[2]],'شريحة الفلين');}
  flush();if(S.eye)drawEye(t);requestAnimationFrame(frame);}

if(location.search.includes('test'))window.__m={S,P,tap,ORG,TRAY,HIT:()=>HIT,tagAt,EYE:()=>EYE};

/* سحب البطاقة */
(()=>{const g=$('#grip'),card=$('.card');let d=null;
  const clamp=(x,y)=>{const r=card.getBoundingClientRect();return [Math.max(4,Math.min(innerWidth-r.width-4,x)),Math.max(4,Math.min(innerHeight-60,y))];};
  g.addEventListener('pointerdown',e=>{g.setPointerCapture(e.pointerId);const r=card.getBoundingClientRect();d={dx:e.clientX-r.left,dy:e.clientY-r.top,w:r.width,moved:0};});
  g.addEventListener('pointermove',e=>{if(!d)return;d.moved++;if(!card.classList.contains('moved')){card.classList.add('moved');card.style.width=d.w+'px';card.style.insetInline='auto';card.style.right='auto';card.style.bottom='auto';}
    card.classList.add('drag');const [x,y]=clamp(e.clientX-d.dx,e.clientY-d.dy);card.style.left=x+'px';card.style.top=y+'px';});
  const end=()=>{d=null;card.classList.remove('drag');};g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
  const reset=()=>{card.classList.remove('moved');['width','insetInline','right','bottom','left','top'].forEach(k=>card.style[k]='');};
  g.addEventListener('dblclick',reset);
  g.addEventListener('keydown',e=>{const st={ArrowUp:[0,-20],ArrowDown:[0,20],ArrowLeft:[-20,0],ArrowRight:[20,0]}[e.key];if(e.key==='Escape'){reset();return;}if(!st)return;e.preventDefault();const r=card.getBoundingClientRect();
    if(!card.classList.contains('moved')){card.classList.add('moved');card.style.width=r.width+'px';card.style.insetInline='auto';card.style.right='auto';card.style.bottom='auto';}const [x,y]=clamp(r.left+st[0],r.top+st[1]);card.style.left=x+'px';card.style.top=y+'px';});
  addEventListener('resize',()=>{if(card.classList.contains('moved')){const r=card.getBoundingClientRect();const [x,y]=clamp(r.left,r.top);card.style.left=x+'px';card.style.top=y+'px';}});})();
nav();render();setEye(0);requestAnimationFrame(frame);
})();
</script>
