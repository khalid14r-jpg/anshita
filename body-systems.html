<style>

  if(st.absorb){const v=[-.04,.6,-.26];for(let k=0;k<5;k++){const q=(u*4+k*.2)%1,a=alongI(PATH.food,st.a+(st.b-st.a)*Math.max(0,u-.05*k));ball([a[0]+(v[0]-a[0])*q,a[1]+(v[1]-a[1])*q,a[2]+(v[2]-a[2])*q],.035,'#F2C230',1);}

  S.focus=p;S.flash=new Set(st.o==='pancreas'?['pancreas','liver']:[st.o]);label(p,st.n);T.u=u;

function pane(n){const m=MS[S.mi];['p1','watch','qq','rr'].forEach((id,k)=>{const e=$('#'+id);if(e)e.hidden=k+1!==n;});
  const lab=['أنفّذ','أراقب','أستنتج','القاعدة'];$('#dt').innerHTML=lab.map((l,k)=>`<i class="${k+1<n?'d':k+1===n?'c':''}"></i>`).join('')+`<span>${ar(n)}/٤ · ${lab[n-1]}</span>`;
  const bodyTask=(n===2&&!TL(m.anim||''))||(n===1&&(m.seq||m.find));mini(SMALL()&&bodyTask);$('.cin').scrollTop=0;}
function renderExplore(){const c=$('#cin');const all=Object.keys(ORG);mini(false);
  c.innerHTML=`<p class="kick">استكشاف حر</p><h2>أجهزة جسم الإنسان</h2><p class="lead">${S.sel?'':'اضغط على أي عضو في المجسّم لتعرف اسمه ووظيفته. الأزرار في الأعلى تُظهر الأجهزة أو تخفيها.'}</p>
   ${S.sel?`<p class="info"><b>${ORG[S.sel].n}</b>${ORG[S.sel].d}<br><small>الجهاز: ${ORG[S.sel].s.map(s=>SYS[s].n).join('، ')}</small></p>`:''}
   <p class="small">اضغط على عضو في المجسّم، أو على اسمه هنا. اكتشفت <b>${ar(S.seen.size)}</b> من ${ar(all.length)}.</p>
   <div class="olist">${Object.entries(SYS).map(([sk,sv])=>`<div class="ogrp"><b><i style="background:${sv.c}"></i>الجهاز ${sv.n}</b><div class="chips">${all.filter(k=>ORG[k].s[0]===sk).map(k=>`<button type="button" class="obtn ${S.sel===k?'sel':S.seen.has(k)?'got':''}" data-org="${k}">${S.seen.has(k)?'✓ ':''}${ORG[k].n}</button>`).join('')}</div></div>`).join('')}</div><button class="go full" type="button" id="st1">ابدأ «رحلة الغذاء» ←</button>
   <p class="src">📖 الكتاب ص١٠٨–١١٧</p>`;$('#st1').onclick=()=>open(1);
  c.querySelectorAll('[data-org]').forEach(b=>b.onclick=()=>{const k=b.dataset.org;if(!on(k)){ORG[k].s.forEach(x=>S.vis[x]=1);nav();}S.sel=k;S.seen.add(k);renderExplore();c.scrollTop=0;});}
/* الضغط */
function tagAt(x,y){const inP=(p)=>{let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){if(((p[i][1]>y)!==(p[j][1]>y))&&(x<(p[j][0]-p[i][0])*(y-p[i][1])/(p[j][1]-p[i][1])+p[i][0]))c=!c;}return c;};
  const dS=(a,b)=>{const vx=b[0]-a[0],vy=b[1]-a[1],t=Math.max(0,Math.min(1,((x-a[0])*vx+(y-a[1])*vy)/((vx*vx+vy*vy)||1)));return Math.hypot(x-a[0]-vx*t,y-a[1]-vy*t);};
  const LOW={skin:1,lungs:2,diaph:3};let low=null;for(let i=HIT.length-1;i>=0;i--){const h=HIT[i];const ok=h.poly?inP(h.poly):h.c?Math.hypot(x-h.c[0],y-h.c[1])<h.c[2]:dS(h.seg[0],h.seg[1])<h.seg[2];if(!ok)continue;if(LOW[h.tag]){if(!low||LOW[h.tag]>LOW[low])low=h.tag;continue;}return h.tag;}return low;}
function tap(x,y){const k=tagAt(x,y);if(!k)return;const m=MS[S.mi];
  if(m.explore){S.sel=k;S.seen.add(k);renderExplore();$('#cin').scrollTop=0;return;}
  S.sel=k;
  if(m.seq&&seqI<m.seq.length){const f=$('#sf');if(k===m.seq[seqI]){const sp=$('#sq').children[seqI];sp.className='f';sp.textContent=ORG[k].n;seqI++;f.className='fb ok';f.textContent='صحيح: '+ORG[k].n+'.';if(seqI===m.seq.length){f.textContent='أحسنت! رتّبت المسار. شاهد الرحلة.';startAnim();}}
    else{f.className='fb bad';f.textContent=(seqI===0?'ليس من هنا يبدأ. ':'ليس بعد «'+ORG[m.seq[seqI-1]].n+'». ')+'تلميح: '+m.hint[m.seq[seqI]];}}
  else if(m.find){const f=$('#sf');if(m.find.includes(k)&&!S.excFound.has(k)){S.excFound.add(k);const sp=$('#fd').querySelector(`[data-f="${k}"]`);sp.className='got';sp.textContent='✓ '+ORG[k].n;f.className='fb ok';f.textContent=ORG[k].n+': '+ORG[k].d;if(S.excFound.size===4){f.textContent+=' وجدت الأربعة!';startAnim();}}
    else if(!m.find.includes(k)){f.className='fb bad';f.textContent=ORG[k].n+' ليس من أعضاء الإخراج.';}}}
const ptr=new Map();let moved=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;});
cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const [px,py]=ptr.get(e.pointerId);const dx=e.clientX-px,dy=e.clientY-py;moved+=Math.abs(dx)+Math.abs(dy);ptr.set(e.pointerId,[e.clientX,e.clientY]);cam.yaw-=dx*.008;cam.pitch=Math.max(-.5,Math.min(.9,cam.pitch+dy*.006));S.drag=performance.now();});
cv.addEventListener('pointerup',e=>{ptr.delete(e.pointerId);if(moved<6)tap(e.clientX,e.clientY);});cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
cv.addEventListener('wheel',e=>{e.preventDefault();cam.dist=Math.max(3.5,Math.min(12,cam.dist*(1+Math.sign(e.deltaY)*.07)));},{passive:false});

/* الحلقة */
function frame(ms){place();{const ty=S.tour&&S.focus&&W<900?Math.max(-.6,Math.min(1.9,S.focus[1]*.6+1.3*.4)):1.3;cam.t[1]+=(ty-cam.t[1])*(reduce?1:.04);}cx.setTransform(DPR,0,0,DPR,0,0);const g=cx.createRadialGradient(CX0,CY0,50,CX0,CY0,Math.max(W,H));g.addColorStop(0,'#3A2A30');g.addColorStop(1,'#140C10');cx.fillStyle=g;cx.fillRect(0,0,W,H);
  const idle=!S.drag||performance.now()-S.drag>2500;if(idle&&!reduce)cam.yaw+=(Math.sin(ms/4000)*.5-cam.yaw)*.01;
  if(!S.anim&&!(S.tour&&S.tour.k!=='food'&&S.tour.k!=='blood')){S.breath=reduce?0:(Math.sin(ms/900)*.5+.5)*.6;}
  body(ms/1000);
  drawTour();if(S.anim){const t=(performance.now()-S.anim.t0)/1000*(reduce?3:1);ANIM[S.anim.k].draw(t);}
  flush();requestAnimationFrame(frame);}

/* سحب البطاقة */
(()=>{const g=$('#grip'),card=$('.card');let d=null;
  const clamp=(x,y)=>{const r=card.getBoundingClientRect();return [Math.max(4,Math.min(innerWidth-r.width-4,x)),Math.max(4,Math.min(innerHeight-60,y))];};
  g.addEventListener('pointerdown',e=>{g.setPointerCapture(e.pointerId);const r=card.getBoundingClientRect();d={dx:e.clientX-r.left,dy:e.clientY-r.top,w:r.width,moved:0};});
  g.addEventListener('pointermove',e=>{if(!d)return;d.moved++;if(!card.classList.contains('moved')){card.classList.add('moved');card.style.width=d.w+'px';card.style.insetInline='auto';card.style.right='auto';card.style.bottom='auto';}
    card.classList.add('drag');const [x,y]=clamp(e.clientX-d.dx,e.clientY-d.dy);card.style.left=x+'px';card.style.top=y+'px';});
  const end=()=>{d=null;card.classList.remove('drag');};g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
  const reset=()=>{card.classList.remove('moved');['width','insetInline','right','bottom','left','top'].forEach(k=>card.style[k]='');};
  g.addEventListener('dblclick',reset);
  g.addEventListener('keydown',e=>{const st={ArrowUp:[0,-20],ArrowDown:[0,20],ArrowLeft:[-20,0],ArrowRight:[20,0]}[e.key];if(e.key==='Escape'){reset();return;}if(!st)return;e.preventDefault();const r=card.getBoundingClientRect();
    if(!card.classList.contains('moved')){card.classList.add('moved');card.style.width=r.width+'px';card.style.insetInline='auto';card.style.right='auto';card.style.bottom='auto';}const [x,y]=clamp(r.left+st[0],r.top+st[1]);card.style.left=x+'px';card.style.top=y+'px';});
  addEventListener('resize',()=>{if(card.classList.contains('moved')){const r=card.getBoundingClientRect();const [x,y]=clamp(r.left,r.top);card.style.left=x+'px';card.style.top=y+'px';}});})();
open(0);requestAnimationFrame(frame);
})();
</script>
