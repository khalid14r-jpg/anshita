<style>
/* Layout: one full-bleed 3D stage whose backdrop darkens as the student dives from sunlit plant to microscopic cell; a breadcrumb rail on top and a label card at the bottom. */
:root{--bg:#F8EEE8;--panel:rgba(255,255,255,.94);--ink:#14231A;--muted:#5A6B5F;--line:#D5E0D2;--accent:#B4434F;--accent-soft:#FBE5E3;--ok:#15803D;--ok-bg:#E6F6EA;--bad:#C2410C;--bad-bg:#FFF0E6;
 --display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif;--body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1612;--panel:rgba(20,30,25,.94);--ink:#E6F0E8;--muted:#9FB3A5;--line:#2C3B32;--accent:#F08A94;--accent-soft:#3A1E22;--ok:#4ADE80;--ok-bg:#12291C;--bad:#FB923C;--bad-bg:#2E1C10;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1612;--panel:rgba(20,30,25,.94);--ink:#E6F0E8;--muted:#9FB3A5;--line:#2C3B32;--accent:#F08A94;--accent-soft:#3A1E22;--ok:#4ADE80;--ok-bg:#12291C;--bad:#FB923C;--bad-bg:#2E1C10;color-scheme:dark}
html,body{direction:rtl}*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;overflow:hidden}
#stage{position:fixed;inset:0;touch-action:none;user-select:none}
#cv{width:100%;height:100%;display:block;cursor:grab}#cv:active{cursor:grabbing}
.top{position:fixed;top:0;inset-inline:0;z-index:5;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:grid;gap:8px;justify-items:center;pointer-events:none}
h1{margin:0;font:800 clamp(1.15rem,3vw,1.6rem)/1.2 var(--display);background:var(--panel);padding:4px 16px;border-radius:99px;box-shadow:0 2px 10px rgba(0,0,0,.12)}

#crumbs button.on{background:var(--accent);color:#fff}#crumbs i{color:var(--muted);font-style:normal;font-size:.8rem}
.side{position:fixed;inset-inline-end:max(12px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);z-index:5;display:grid;gap:6px;justify-items:center;background:var(--panel);border-radius:18px;padding:8px 6px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.side button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:700 1.3rem var(--body);cursor:pointer;line-height:1}

<script>
(()=>{'use strict';document.documentElement.dir='rtl';document.documentElement.lang='ar';
const $=s=>document.querySelector(s),ar=n=>Number(n).toLocaleString('ar-SA');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=$('#cv'),cx=cv.getContext('2d');let W=0,H=0,DPR=1;
const fit=()=>{DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);};addEventListener('resize',fit);fit();

/* ===== محرّك صغير ثلاثي الأبعاد ===== */
const cam={yaw:.5,pitch:.2,dist:10,t:[0,0,0]};let CX0=0,CY0=0;const center=()=>{if(W>=900){CX0=80+(W-80-430)/2;CY0=H*.52;}else{CX0=W/2;CY0=H*.36;}};
const P=p=>{const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);const x=p[0]-cam.t[0],y=p[1]-cam.t[1],z=p[2]-cam.t[2];
  const x1=x*cy-z*sy,z1=x*sy+z*cy,y2=y*cp-z1*sp,z2=y*sp+z1*cp,d=cam.dist-z2,s=Math.min(W,H)*1.1/Math.max(d,.05);return [CX0+x1*s,CY0-y2*s,d,s];};
const LT=(()=>{const v=[-.4,.85,.5],n=Math.hypot(...v);return v.map(a=>a/n);})();
const rgb=h=>{const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];};
const col=(h,k)=>{const c=rgb(h).map(v=>Math.max(0,Math.min(255,Math.round(v*k))));return `rgb(${c[0]},${c[1]},${c[2]})`;};
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],crs=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
let Q=[],LB=[],HIT=[];
const poly=(pts,c,a=1,st=null,tag=null)=>Q.push({k:'p',pts,c,a,st,tag});
const ball=(p,r,c,a=1,tag=null)=>Q.push({k:'s',p,r,c,a,tag});
const rod=(p,q,r,c,a=1,tag=null)=>Q.push({k:'l',p,q,r,c,a,tag});
const label=(p,t)=>LB.push({p,t});
const clip=(pts,n,c)=>{const o=[];for(let i=0;i<pts.length;i++){const A=pts[i],B=pts[(i+1)%pts.length],da=A[0]*n[0]+A[1]*n[1]+A[2]*n[2]-c,db=B[0]*n[0]+B[1]*n[1]+B[2]*n[2]-c;if(da<=0)o.push(A);if((da<=0)!==(db<=0)){const t=da/(da-db);o.push([A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t]);}}return o;};
const flush=(alpha)=>{const it=[];for(const o of Q){if(o.k==='p'){const pr=o.pts.map(P);if(pr.some(v=>v[2]<.15))continue;o.pr=pr;o.d=pr.reduce((s,v)=>s+v[2],0)/pr.length;const nn=crs(sub(o.pts[1],o.pts[0]),sub(o.pts[2],o.pts[0])),L=Math.hypot(...nn)||1;o.sh=.6+.45*Math.abs((nn[0]*LT[0]+nn[1]*LT[1]+nn[2]*LT[2])/L);}
    else if(o.k==='s'){o.pr=P(o.p);if(o.pr[2]<.15)continue;o.d=o.pr[2];}else{o.pa=P(o.p);o.pb=P(o.q);if(o.pa[2]<.15||o.pb[2]<.15)continue;o.d=(o.pa[2]+o.pb[2])/2;}it.push(o);}
  it.sort((a,b)=>b.d-a.d);
  for(const o of it){cx.globalAlpha=o.a*alpha;let hit=null;
    if(o.k==='p'){cx.beginPath();o.pr.forEach((v,i)=>i?cx.lineTo(v[0],v[1]):cx.moveTo(v[0],v[1]));cx.closePath();cx.fillStyle=col(o.c,o.sh);cx.fill();if(o.st){cx.strokeStyle=o.st;cx.lineWidth=1;cx.lineJoin='round';cx.stroke();}if(o.tag)hit={tag:o.tag,poly:o.pr};}
    else if(o.k==='s'){const [x,y,,s]=o.pr,r=o.r*s;if(r<.3)continue;const g=cx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);g.addColorStop(0,col(o.c,1.5));g.addColorStop(.6,col(o.c,1));g.addColorStop(1,col(o.c,.6));cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r,0,7);cx.fill();if(o.tag)hit={tag:o.tag,c:[x,y,r]};}
    else{const w=Math.max(1,o.r*(o.pa[3]+o.pb[3]));cx.strokeStyle=col(o.c,1);cx.lineCap='round';cx.lineWidth=w;cx.beginPath();cx.moveTo(o.pa[0],o.pa[1]);cx.lineTo(o.pb[0],o.pb[1]);cx.stroke();if(o.tag)hit={tag:o.tag,seg:[o.pa,o.pb,w/2+4]};}
    if(hit&&alpha>.9)HIT.push(hit);}
  cx.globalAlpha=1;Q=[];};
const drawLabels=(alpha)=>{cx.globalAlpha=alpha;cx.font='600 13px "IBM Plex Sans Arabic",system-ui,sans-serif';cx.direction='rtl';cx.textBaseline='middle';cx.textAlign='center';
  for(const l of LB){const [x,y,d]=P(l.p);if(d<.2)continue;const w=cx.measureText(l.t).width+16,lx=Math.min(W-w/2-8,Math.max(w/2+8,x+40)),ly=Math.max(120,y-36);
    cx.strokeStyle='rgba(255,255,255,.85)';cx.lineWidth=1.4;cx.beginPath();cx.moveTo(x,y);cx.lineTo(lx,ly);cx.stroke();cx.fillStyle='#fff';cx.beginPath();cx.arc(x,y,3.5,0,7);cx.fill();
    cx.fillStyle='rgba(12,22,16,.88)';cx.beginPath();cx.roundRect?cx.roundRect(lx-w/2,ly-12,w,24,9):cx.rect(lx-w/2,ly-12,w,24);cx.fill();cx.fillStyle='#F2F8F3';cx.fillText(l.t,lx,ly);}cx.globalAlpha=1;LB=[];};

/* أشكال مساعدة */
const ellip=(c,rx,ry,rz,colr,a,tag,NU=8,NV=10,rot=0)=>{const cr=Math.cos(rot),sr=Math.sin(rot);const S=(u,v)=>{const x=rx*Math.sin(u)*Math.cos(v),y=ry*Math.cos(u),z=rz*Math.sin(u)*Math.sin(v);return [c[0]+x*cr-y*sr,c[1]+x*sr+y*cr,c[2]+z];};
  for(let i=0;i<NU;i++)for(let j=0;j<NV;j++){const u0=i/NU*Math.PI,u1=(i+1)/NU*Math.PI,v0=j/NV*2*Math.PI,v1=(j+1)/NV*2*Math.PI;poly([S(u0,v0),S(u1,v0),S(u1,v1),S(u0,v1)],colr,a,null,tag);}};
const box=(x0,y0,z0,x1,y1,z1,colr,a,st,tag,cut=null)=>{const F=[[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],[[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],[x1,y0,z0]],[[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]],[[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]],[[x0,y1,z0],[x0,y1,z1],[x1,y1,z1],[x1,y1,z0]],[[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]];
  F.forEach(f=>{const p=cut!=null?clip(f,[0,0,1],cut):f;if(p.length>=3)poly(p,colr,a,st,tag);});};

/* ===== المستويات ===== */
const SKIN='#E9B793';
const capsule=(a,b,r,c,tag)=>{rod(a,b,r,c,1,tag);};
const blob=(c,R,colr,a,tag,cut,NU=10,NV=16,wob=1)=>{const S=(u,v)=>{const k=1+wob*(.08*Math.sin(3*v)+.05*Math.cos(2*u+v));return [c[0]+R[0]*k*Math.sin(u)*Math.cos(v),c[1]+R[1]*k*Math.cos(u),c[2]+R[2]*k*Math.sin(u)*Math.sin(v)];};
  for(let i=0;i<NU;i++)for(let j=0;j<NV;j++){const u0=i/NU*Math.PI,u1=(i+1)/NU*Math.PI,v0=j/NV*2*Math.PI,v1=(j+1)/NV*2*Math.PI;let p=[S(u0,v0),S(u1,v0),S(u1,v1),S(u0,v1)];if(cut!=null)p=clip(p,[0,0,1],cut);if(p.length>=3)poly(p,colr,a,null,tag);}};
const LV=[
 {name:'الإنسان',view:{yaw:.35,pitch:.12},C:[0,1.2,0],F:[1.13,1.45,.3],D:11,
  draw(t){const br=Math.sin(t*1.2)*.02;ellip([0,2.25,0],.72,1.1,.42,'#4C7BD9',1,'body',8,12);ball([0,3.78+br,0],.46,SKIN,1,'skin');rod([0,3.2,0],[0,3.4,0],.16,SKIN,1,'skin');
   [1,-1].forEach(s=>{rod([s*.78,3.05,0],[s*1.08,1.95,.12],.17,'#4C7BD9',1,'body');rod([s*1.08,1.95,.12],[s*1.16,1.0,.35],.14,SKIN,1,'skin');ellip([s*1.18,.74,.4],.13,.22,.09,SKIN,1,'skin',4,8);
    rod([s*.32,1.2,0],[s*.36,-.4,0],.24,'#3A3F55',1,'body');rod([s*.36,-.4,0],[s*.38,-1.9,0],.2,'#3A3F55',1,'body');ellip([s*.38,-2.05,.15],.15,.08,.26,'#222',1,'body',4,6);});
   label([0,3.78,.4],'الرأس');label([1.13,1.45,.3],'الجلد يغطي الذراع');}},
 {name:'الجلد',view:{yaw:0,pitch:.25},C:[0,0,0],F:[.6,.3,1.17],D:9,
  draw(t){const R=1.2,N=18,L=6;for(let i=0;i<N;i++)for(let k=0;k<8;k++){const a0=i/N*2*Math.PI,a1=(i+1)/N*2*Math.PI,x0=-L/2+k*L/8,x1=x0+L/8;poly([[x0,R*Math.sin(a0),R*Math.cos(a0)],[x1,R*Math.sin(a0),R*Math.cos(a0)],[x1,R*Math.sin(a1),R*Math.cos(a1)],[x0,R*Math.sin(a1),R*Math.cos(a1)]],(i+k)%2?'#E3AF8A':SKIN,1,null,'skin');}
   for(let n=0;n<14;n++){const x=-2.6+HR(n,1)*5.2,a=-.8+HR(n,2)*1.6;rod([x,R*Math.sin(a),R*Math.cos(a)],[x+.25,R*Math.sin(a+.12),R*Math.cos(a+.12)],.008,'#C98F6E',1);}
   const F=this.F,q=.22;poly([[F[0]-q,F[1]-q,1.25],[F[0]+q,F[1]-q,1.25],[F[0]+q,F[1]+q,1.25],[F[0]-q,F[1]+q,1.25]],'#FFE066',.45,'#FFF3A3');label(F,'نكبّر هنا');}},
 {name:'النسيج الطلائي',view:{yaw:.45,pitch:.4},C:[0,0,0],F:[0,1.75,1.0],D:11,
  draw(t){const X=6,Z=3,R=.42;for(let l=0;l<3;l++){const y0=1.55-l*.33,y1=y0+.3,cols=['#F2B8B0','#EBA79F','#E0958D'][l];
    for(let c=0;c<9;c++)for(let r=0;r<4;r++){const x=-X/2+.5+c*R*1.5,z=-Z/2+.5+r*R*1.73+(c%2?R*.86:0)+(l%2)*.2;if(x>X/2-.3||z>Z/2-.2)continue;const b=hexPts(x,z,R*.97,y0),tp=hexPts(x,z,R*.97,y1);
     for(let k=0;k<6;k++)poly([b[k],b[(k+1)%6],tp[(k+1)%6],tp[k]],cols,1,'rgba(120,40,40,.45)','tissue');poly(tp,cols,1,'rgba(120,40,40,.45)','tissue');if(l===0)ball([x,y1+.04,z],.1,'#7A3FA0',1,'tissue');}}

   for(let n=0;n<22;n++){const a=[-X/2+.3+HR(n,1)*(X-.6),-1.6+HR(n,2)*2.2,-Z/2+.2+HR(n,3)*(Z-.4)];rod(a,[a[0]+.9*(HR(n,4)-.5)*2,a[1]+.3*(HR(n,5)-.5),a[2]+.4*(HR(n,6)-.5)],.03,'#D9A08A',.9,'con');}
   label([0,1.9,1.0],'خلية واحدة');label([2.4,-.9,1.4],'نسيج آخر تحته');}},
 {name:'الخلية الحيوانية',view:{yaw:.3,pitch:.45},C:[0,0,0],F:[0,0,0],D:7,
  draw(t){const cut=S.cut?.02:null,br=reduce?0:Math.sin(t*1.3)*.03;
   blob([0,0,0],[2.3+br,1.7,.95],'#F6C1B6',cut!=null?.9:.95,'mem',cut,10,18);
   if(cut!=null){blob([0,0,0],[2.12,1.55,.82],'#FCE9E2',.85,'cyto',cut,8,16);
    blob([-.35,.2,0],[.6,.55,.5],'#B48AD8',.85,'nuc',cut,6,10,0);
    [[-.7,.35,-.1,-.15,.1,-.2],[-.6,-.05,-.15,-.05,.45,-.1],[-.5,.5,-.25,-.1,-.1,-.25],[-.75,0,-.3,-.35,.55,-.3]].forEach(([a,b,c,d,e,f],i)=>rod([a,b,c],[d,e,f],.05,['#C2185B','#1565C0','#2E7D32','#D84315'][i],1,'chr'));
    [[1.1,.6,-.3],[.9,-.7,-.35],[-1.3,-.7,-.3],[.2,-1.0,-.4],[1.6,-.1,-.3]].forEach(([x,y,z],i)=>rod([x-.2,y-.05,z],[x+.2,y+.07,z],.09,'#F08C3A',1,'mito'));
    [[.6,.1,-.35,.22],[1.4,-.55,-.3,.16],[-1.4,.4,-.3,.18]].forEach(([x,y,z,r])=>ball([x,y,z],r,'#9FD3F0',.9,'vac'));
    for(let n=0;n<30;n++){const a=HR(n,7)*6.28,rr=.5+HR(n,8)*1.4;ball([Math.cos(a)*rr,Math.sin(a)*rr*.7,-.5+HR(n,9)*.4],.03,'#B07A5A',.9,'cyto');}}
   if(S.sel){label(PARTS[S.sel].at,PARTS[S.sel].n);}}}];
const hexPts=(x,z,R,y)=>[0,1,2,3,4,5].map(k=>[x+R*Math.cos(k*Math.PI/3),y,z+R*Math.sin(k*Math.PI/3)]);
const PARTS={mem:{n:'الغشاء البلازمي',d:'يحيط بالخلية، ويعطيها شكلها، ويسمح بدخول المواد وخروجها. ولا يحيط به جدار خلوي.',at:[2.2,.4,-.2]},
 cyto:{n:'السيتوبلازم',d:'مادة تشبه الهلام فيها كمية كبيرة من الماء، وفيها أجزاء الخلية.',at:[.3,.8,-.4]},
 nuc:{n:'النواة',d:'مركز التحكّم في الخلية: تنظّم تفاعلاتها، وتخزن المعلومات الضرورية لانقسامها.',at:[-.35,.7,-.2]},
 chr:{n:'الكروموسومات',d:'أشرطة طويلة داخل النواة، تخزن معلومات الخلية وتنقلها إلى خلايا النسل الجديد.',at:[-.6,.3,-.15]},
 mito:{n:'الميتوكندريا',d:'مصدر طاقة الخلية: تحرر الطاقة من الغذاء.',at:[1.1,.6,-.3]},
 vac:{n:'الفجوات',d:'تخزن الماء والغذاء وبعض الفضلات، وهي صغيرة في الخلية الحيوانية.',at:[.6,.1,-.35]}};
const ORG={skin:'الجلد: أكبر عضو في جسم الإنسان، ويغطي الجسم كله.',body:'الإنسان مخلوق حي عديد الخلايا، يتكوّن جسمه من أجهزة تعمل معًا.',tissue:'خلايا متشابهة متلاصقة تقوم بالوظيفة نفسها: نسيج. وهذا النسيج يغطي الجسم.',con:'تحت النسيج الطلائي نسيج آخر هو النسيج الضامّ. والجلد عضو لأنه يتكوّن من نسيجين أو أكثر.'};
const TXT=[{k:'المستوى ١ · مخلوق حي',l:'الإنسان مخلوق حي عديد الخلايا. ويغطي جسمه الجلد، وهو أكبر عضو في جسم الإنسان.',h:'اضغط على الجلد لتعرف عنه، ثم كبّر (＋) لتقترب من الذراع.'},
 {k:'المستوى ٢ · عضو',l:'الجلد عضو. والعضو مجموعة من نسيجين مختلفين أو أكثر، تعمل معًا للقيام بوظيفة محددة.',h:'كبّر أكثر لترى ما يتكوّن منه الجلد.'},
 {k:'المستوى ٣ · نسيج',l:'النسيج الطلائي يغطي أجزاء الجسم الداخلية، وطبقة الجلد الخارجية، والطبقة التي تبطّن باطن الخد.',h:'كبّر أكثر لتدخل إلى خلية واحدة.'},
 {k:'المستوى ٤ · خلية',l:'خلية حيوانية من النسيج الطلائي، تشبه خلايا باطن الخد التي فحصتها في الكتاب. اضغط على أجزائها لتعرفها.',h:'دوّر الخلية بالسحب. اكتشف الأجزاء الستة.'}];

/* ===== الحالة والتفاعل ===== */
const S={z:0,zt:0,cut:true,sel:null,got:new Set(),org:null,lastLv:-1,qDone:false,drag:0};
const crumbs=$('#crumbs');crumbs.innerHTML=LV.map((l,i)=>`${i?'<i>←</i>':''}<button type="button" data-l="${i}">${l.name}</button>`).join('');
crumbs.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{S.zt=+b.dataset.l;});
const zr=$('#zr');zr.oninput=()=>{S.zt=+zr.value/100;S.z=S.zt;};
$('#zin').onclick=()=>{S.zt=Math.min(3.4,Math.floor(S.zt+1e-6)+1);};$('#zout').onclick=()=>{S.zt=Math.max(0,Math.ceil(S.zt-1e-6)-1);};
const lvNow=()=>Math.min(3,Math.max(0,Math.round(S.z-.15)));
function panel(){const L=lvNow(),T=TXT[L];if(L!==S.lastLv){S.lastLv=L;S.sel=null;S.org=null;$('#kick').textContent=T.k;$('#name').textContent=LV[L].name;$('#lead').textContent=T.l;$('#hint').textContent=T.h;crumbs.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('on',+b.dataset.l===L));extra();}}
function extra(){const L=lvNow(),ex=$('#extra');
  if(L<3){ex.innerHTML=S.org?`<p class="info">${S.org}</p>`:'';return;}
  ex.innerHTML=`<button class="tg" type="button" id="cut" aria-pressed="${S.cut}">${S.cut?'🔪 الخلية مقطوعة: أغلقها':'🔪 اقطع الخلية لترى داخلها'}</button>
   ${S.sel?`<p class="info"><b>${PARTS[S.sel].n}</b>${PARTS[S.sel].d}</p>`:''}
   <div class="parts">${Object.keys(PARTS).map(k=>`<span class="${S.got.has(k)?'got':''}">${S.got.has(k)?'✓ ':''}${PARTS[k].n}</span>`).join('')}</div>
   <p class="hint" style="margin:0">اكتشفت ${ar(S.got.size)} من ${ar(6)}</p>
   ${S.got.size>=6||S.qDone?`<div class="q" id="qq"><p>سؤال: ما الجزآن اللذان وجدتهما في الخلية النباتية ولم تجدهما هنا؟</p>${['النواة والميتوكندريا','الجدار الخلوي والبلاستيدات الخضراء','الغشاء البلازمي والسيتوبلازم'].map((o,i)=>`<button class="opt" type="button" data-o="${i}">${o}</button>`).join('')}<p class="fb" id="qfb"></p></div>`:''}`;
  $('#cut').onclick=()=>{S.cut=!S.cut;extra();};
  ex.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const i=+b.dataset.o,f=$('#qfb');if(i===1){b.classList.add('right');ex.querySelectorAll('[data-o]').forEach(x=>x.disabled=true);f.className='fb ok';f.innerHTML='صحيح! تنفرد الخلية النباتية بـ<b>الجدار الخلوي</b> و<b>البلاستيدات الخضراء</b>؛ لذلك يتغيّر شكل الخلية الحيوانية بسهولة، ولا تصنع غذاءها. وفجوات الخلية الحيوانية أصغر.';S.qDone=true;}
    else{b.classList.add('wrong');b.disabled=true;f.className='fb bad';f.textContent=i===0?'النواة والميتوكندريا وجدتهما هنا أيضًا. ابحث عمّا يحيط بالغشاء في النبات، وعن الأجسام الخضراء.':'الغشاء والسيتوبلازم في كل خلية. فكّر في الطبقة الصلبة واللون الأخضر.';}});}

/* الضغط والسحب */
const ptr=new Map();let pd=0,moved=0,downAt=[0,0];
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;downAt=[e.clientX,e.clientY];S.drag=performance.now();});
cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const [px,py]=ptr.get(e.pointerId);
  if(ptr.size===1){cam.yaw-=(e.clientX-px)*.008;cam.pitch=Math.max(-1.1,Math.min(1.35,cam.pitch+(e.clientY-py)*.008));}
  ptr.set(e.pointerId,[e.clientX,e.clientY]);moved+=Math.abs(e.clientX-px)+Math.abs(e.clientY-py);S.drag=performance.now();
  if(ptr.size===2){const [a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd){S.zt=Math.max(0,Math.min(3.4,S.zt+(d-pd)*.006));S.z=S.zt;}pd=d;}});
const up=e=>{ptr.delete(e.pointerId);pd=0;if(moved<6&&ptr.size===0)tap(e.clientX,e.clientY);};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{ptr.delete(e.pointerId);pd=0;});
cv.addEventListener('wheel',e=>{e.preventDefault();S.zt=Math.max(0,Math.min(3.4,S.zt-Math.sign(e.deltaY)*.12));},{passive:false});
const inPoly=(x,y,p)=>{let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){if(((p[i][1]>y)!==(p[j][1]>y))&&(x<(p[j][0]-p[i][0])*(y-p[i][1])/(p[j][1]-p[i][1])+p[i][0]))c=!c;}return c;};
const dSeg=(x,y,a,b)=>{const vx=b[0]-a[0],vy=b[1]-a[1],t=Math.max(0,Math.min(1,((x-a[0])*vx+(y-a[1])*vy)/((vx*vx+vy*vy)||1)));return Math.hypot(x-a[0]-vx*t,y-a[1]-vy*t);};
function tap(x,y){let tag=null;for(let i=HIT.length-1;i>=0;i--){const h=HIT[i];if(h.poly&&inPoly(x,y,h.poly)||h.c&&Math.hypot(x-h.c[0],y-h.c[1])<h.c[2]||h.seg&&dSeg(x,y,h.seg[0],h.seg[1])<h.seg[2]){tag=h.tag;break;}}
  if(!tag)return;const L=lvNow();if(L===3&&PARTS[tag]){if(tag!=='mem'&&!S.cut)return;S.sel=tag;S.got.add(tag);extra();}else if(L<3&&ORG[tag]){S.org=ORG[tag];extra();}}
addEventListener('keydown',e=>{if(e.key==='+'||e.key==='='){$('#zin').click();}else if(e.key==='-'){$('#zout').click();}});

/* ===== الحلقة ===== */
const sm=u=>u<0?0:u>1?1:u*u*(3-2*u);
const BG=['#FBEFE6','#F6E2D6','#3A2428','#1C1014'];
function frame(ms){const t=reduce?0:ms/1000;S.z+=(S.zt-S.z)*(reduce?1:.08);if(Math.abs(S.zt-S.z)<.002)S.z=S.zt;zr.value=Math.round(S.z*100);panel();
  center();cx.setTransform(DPR,0,0,DPR,0,0);const zi=Math.min(3,Math.floor(S.z)),fz=S.z-zi;
  const g=cx.createLinearGradient(0,0,0,H);const mix=(a,b,k)=>{const A=rgb(a),B=rgb(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')})`;};
  const c1=mix(BG[zi],BG[Math.min(3,zi+1)],zi<3?sm((fz-.5)/.5):0);g.addColorStop(0,c1);g.addColorStop(1,mix(BG[zi],'#000000',.25));cx.fillStyle=g;cx.fillRect(0,0,W,H);
  HIT=[];const idle=performance.now()-S.drag>1800;
  const passes=[];for(let L=0;L<4;L++){const u=S.z-L;let a=0;if(u>=-.35&&u<0)a=(u+.35)/.35;else if(u>=0&&u<=.65)a=1;else if(u>.65&&u<1&&L<3)a=1-(u-.65)/.35;else if(L===3&&u>=0)a=1;if(a>0)passes.push([L,u,a]);}
  for(const [L,u,a] of passes){const lv=LV[L],uu=Math.max(-.35,Math.min(1,u));cam.dist=lv.D*Math.pow(.17,Math.max(-.35,L===3?Math.min(u,.4):uu));const k=sm(Math.max(0,Math.min(1,uu/.9)));cam.t=lv.C.map((c,i)=>c+(lv.F[i]-c)*(L===3?0:k));
    if(idle&&L===lvNow()){const sway=reduce?0:Math.sin(t*.35)*.35;cam.yaw+=(lv.view.yaw+sway-cam.yaw)*.02;cam.pitch+=(lv.view.pitch-cam.pitch)*.02;}
    lv.draw(t);flush(a);drawLabels(a*(L===lvNow()?1:0));}
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
