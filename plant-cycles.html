<style>

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#140D10;--panel:rgba(30,20,24,.95);--ink:#F2E8EA;--muted:#B9A5AA;--line:#3A2A30;--accent:#7DD08A;--accent-soft:#1B3322;--ok:#4ADE80;--ok-bg:#12291C;--bad:#FB923C;--bad-bg:#2E1C10;color-scheme:dark}}

html,body{direction:rtl}*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%}

.row{display:flex;gap:8px;flex-wrap:wrap}

@media (min-width:900px){.card{inset-inline:auto;inset-inline-start:max(16px,env(safe-area-inset-right,0px));bottom:auto;top:calc(110px + env(safe-area-inset-top,0px));width:380px;padding:0}.cin{max-height:calc(100vh - 140px)}.hd .tg{display:none}}
.hd{display:flex;align-items:center;gap:8px}.hd>div{flex:1;min-width:0}.hd .tg{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;width:36px;height:32px;font-size:1rem;cursor:pointer;flex:none}

.card.mini .lead,.card.mini .src,.card.mini .full{display:none}.card.mini h2{font-size:1rem}.card.mini .cin{gap:5px;padding:8px 14px}

.srt{display:grid;gap:6px}.srow{display:grid;gap:4px;border-bottom:1px solid var(--line);padding-bottom:6px}.srow.ok>span:first-child{color:var(--ok);font-weight:700}.sbt{display:flex;flex-wrap:wrap;gap:5px}
.hint2{margin:0;font-size:.85rem;color:var(--muted)}
.pane{display:grid;gap:8px}
@media (max-width:600px){h2{font-size:1.1rem}.cin{max-height:40vh}.nav button{padding:3px 8px;font-size:.8rem}}
</style>

<div id="stage"><canvas id="cv" aria-label="نموذج ثلاثي الأبعاد لنباتات وأزهار"></canvas></div>
<div class="top"><h1>دورات حياة النباتات</h1><nav class="nav" id="ms" aria-label="المهام"></nav><div id="sys"></div></div>

<script>
(()=>{'use strict';document.documentElement.dir='rtl';document.documentElement.lang='ar';
const $=s=>document.querySelector(s),ar=n=>Number(n).toLocaleString('ar-SA');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=$('#cv'),cx=cv.getContext('2d');let W=0,H=0,DPR=1,CX0=0,CY0=0;
let AVH=600;const fit=()=>{DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);};
const place=()=>{const top=($('#sys')?.getBoundingClientRect().bottom||100)+8;if($('.card')?.classList.contains('moved')){CX0=W/2;AVH=H-top-10;CY0=top+AVH*.5;return;}if(W>=900){CX0=(W-400)/2;AVH=H-top-10;CY0=top+AVH*.52;}else{const b=$('.card .cin')?.getBoundingClientRect().top||H*.6;AVH=Math.max(160,b-top-6);CX0=W/2;CY0=top+AVH*.5;}};addEventListener('resize',fit);fit();

/* ===== محرّك ===== */
const cam={yaw:0,pitch:.08,dist:5.2,t:[0,1.3,0]};
const P=p=>{const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);const x=p[0]-cam.t[0],y=p[1]-cam.t[1],z=p[2]-cam.t[2];
  const x1=x*cy-z*sy,z1=x*sy+z*cy,y2=y*cp-z1*sp,z2=y*sp+z1*cp,d=cam.dist-z2,s=Math.min(W*1.05,AVH*1.18)/Math.max(d,.05);return [CX0+x1*s,CY0-y2*s,d,s];};
const LT=(()=>{const v=[-.4,.8,.6],n=Math.hypot(...v);return v.map(a=>a/n);})();
const rgb=h=>{const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];};
const col=(h,k)=>{const c=rgb(h).map(v=>Math.max(0,Math.min(255,Math.round(v*k))));return `rgb(${c[0]},${c[1]},${c[2]})`;};
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],crs=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
let Q=[],LB=[],HIT=[];
const poly=(pts,c,a=1,tag=null)=>Q.push({k:'p',pts,c,a,tag});
const ball=(p,r,c,a=1,tag=null)=>Q.push({k:'s',p,r,c,a,tag});
const rod=(p,q,r,c,a=1,tag=null)=>Q.push({k:'l',p,q,r,c,a,tag});
const label=(p,t)=>LB.push({p,t});
const flush=()=>{const it=[];HIT=[];for(const o of Q){if(o.k==='p'){o.pr=o.pts.map(P);o.d=o.pr.reduce((s,v)=>s+v[2],0)/o.pr.length;const nn=crs(sub(o.pts[1],o.pts[0]),sub(o.pts[2],o.pts[0])),L=Math.hypot(...nn)||1;o.sh=.62+.45*Math.abs((nn[0]*LT[0]+nn[1]*LT[1]+nn[2]*LT[2])/L);}
    else if(o.k==='s'){o.pr=P(o.p);o.d=o.pr[2];}else{o.pa=P(o.p);o.pb=P(o.q);o.d=(o.pa[2]+o.pb[2])/2;}it.push(o);}
  it.sort((a,b)=>b.d-a.d);
  for(const o of it){cx.globalAlpha=o.a;let h=null;
    if(o.k==='p'){cx.beginPath();o.pr.forEach((v,i)=>i?cx.lineTo(v[0],v[1]):cx.moveTo(v[0],v[1]));cx.closePath();cx.fillStyle=col(o.c,o.sh);cx.fill();if(o.tag)h={tag:o.tag,poly:o.pr};}
    else if(o.k==='s'){const [x,y,,s]=o.pr,r=Math.max(.5,o.r*s);const g=cx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);g.addColorStop(0,col(o.c,1.45));g.addColorStop(.6,col(o.c,1));g.addColorStop(1,col(o.c,.6));cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r,0,7);cx.fill();if(o.tag)h={tag:o.tag,c:[x,y,r+3]};}
    else{const w=Math.max(1.2,o.r*(o.pa[3]+o.pb[3]));cx.strokeStyle=col(o.c,1);cx.lineCap='round';cx.lineWidth=w;cx.beginPath();cx.moveTo(o.pa[0],o.pa[1]);cx.lineTo(o.pb[0],o.pb[1]);cx.stroke();if(o.tag)h={tag:o.tag,seg:[o.pa,o.pb,w/2+5]};}
    if(h)HIT.push(h);}
  cx.globalAlpha=1;Q=[];
  cx.font='600 12.5px "IBM Plex Sans Arabic",system-ui,sans-serif';cx.direction='rtl';cx.textBaseline='middle';cx.textAlign='center';
  for(const l of LB){const [x,y]=P(l.p);const w=cx.measureText(l.t).width+14,lx=Math.min(W-w/2-6,Math.max(w/2+6,x)),ly=y-22;cx.strokeStyle='rgba(255,255,255,.8)';cx.lineWidth=1.2;cx.beginPath();cx.moveTo(x,y);cx.lineTo(lx,ly+10);cx.stroke();
    cx.fillStyle='rgba(30,14,18,.88)';cx.beginPath();cx.roundRect?cx.roundRect(lx-w/2,ly-11,w,22,8):cx.rect(lx-w/2,ly-11,w,22);cx.fill();cx.fillStyle='#FBEFF1';cx.fillText(l.t,lx,ly);}LB=[];};
const ellip=(c,rx,ry,rz,colr,a,tag,NU=6,NV=10,rot=0)=>{const cr=Math.cos(rot),sr=Math.sin(rot);const S=(u,v)=>{const x=rx*Math.sin(u)*Math.cos(v),y=ry*Math.cos(u),z=rz*Math.sin(u)*Math.sin(v);return [c[0]+x*cr-y*sr,c[1]+x*sr+y*cr,c[2]+z];};
  for(let i=0;i<NU;i++)for(let j=0;j<NV;j++){const u0=i/NU*Math.PI,u1=(i+1)/NU*Math.PI,v0=j/NV*2*Math.PI,v1=(j+1)/NV*2*Math.PI;poly([S(u0,v0),S(u1,v0),S(u1,v1),S(u0,v1)],colr,a,tag);}};
const tube=(path,r,c,a,tag)=>{for(let i=0;i<path.length-1;i++)rod(path[i],path[i+1],r,c,a,tag);};
const along=(path,t)=>{const L=[0];for(let i=1;i<path.length;i++)L.push(L[i-1]+Math.hypot(...sub(path[i],path[i-1])));const T=Math.max(0,Math.min(1,t))*L[L.length-1];let i=1;while(i<L.length-1&&L[i]<T)i++;const k=(T-L[i-1])/((L[i]-L[i-1])||1);return path[i-1].map((v,j)=>v+(path[i][j]-v)*k);};
const HR=(i,k=1)=>{const v=Math.sin(i*12.9898+k*78.233)*43758.5453;return v-Math.floor(v);};

/* ===== النماذج ===== */
const mix3=(a,b,t)=>a.map((v,j)=>v+(b[j]-v)*t);

const dotsFlow=(a,b,u,n,c,r=.03,sp=1.5)=>{for(let k=0;k<n;k++){const q=(u*sp+k/n)%1;ball(mix3(a,b,q),r,c,1);}};
const GY=-2.2;
const ORG={petal:{n:'البتلات',d:'أوراق ملوّنة في الزهرة، ألوانها وروائحها تجذب الملقّحات مثل النحل.'},
 sepal:{n:'السبلات',d:'أوراق خضراء صغيرة أسفل الزهرة، تحمي البرعم قبل أن يتفتّح.'},
 anther:{n:'المتك',d:'يتم فيه إنتاج حبوب اللقاح، وفي داخلها يوجد المشيج المذكر.'},
 stigma:{n:'الميسم',d:'سطح لزج أعلى القلم، تسقط عليه حبوب اللقاح.'},
 style:{n:'القلم',d:'أنبوب يصل الميسم بالمبيض، وينمو عبره أنبوب اللقاح.'},
 ovary:{n:'المبيض',d:'جزء منتفخ يقع تحت الميسم، ويوجد داخله المشيج المؤنث (البويضة).'},
 ovule:{n:'البويضة',d:'فيها المشيج المؤنث. وبعد الإخصاب تنمو البذرة من البويضة المخصبة.'},
 stem:{n:'الساق',d:'يدعم النبات، ويحمل الأوراق والأزهار.'},
 leaf:{n:'الورقة',d:'من وظائفها القيام بعملية البناء الضوئي.'}};
const PET=['#E8508A','#EE6A9A','#E8508A','#EE6A9A','#E8508A'];
const C=(k,c)=>(S.sel===k||(S.flash&&S.flash.has(k)))?'#FFE066':c;
function flower(c,o={}){const s=o.s||1,T=o.tag?k=>k:()=>null,fr=o.fruit||0,P=(x,y,z)=>[c[0]+x*s,c[1]+y*s,c[2]+z*s];
  if(!o.noStem){rod(P(0,GY/s-c[1]/s,0),P(0,0,0),.05*s,C(o.tag?'stem':'',  '#4E8F38'),1,T('stem'));
    [[-1,-1.2],[1,-1.6]].forEach(([d,y])=>ellip(P(d*.45,y,0),.45*s,.14*s,.2*s,C(o.tag?'leaf':'','#4FA83D'),1,T('leaf'),4,8,d*.5));}
  for(let k=0;k<5;k++){const a=k/5*2*Math.PI+.3;ellip(P(.22*Math.cos(a),.02,.22*Math.sin(a)),.2*s,.06*s,.1*s,C(o.tag?'sepal':'','#5BA845'),1,T('sepal'),3,6,0);}
  const pa=(o.petalA??1)*(1-fr),drop=fr;
  if(pa>.02)for(let k=0;k<5;k++){const a=k/5*2*Math.PI,ca=Math.cos(a),sa=Math.sin(a),px=-sa,pz=ca,dy=-drop*1.8;
    const base=P(.1*ca,.1+dy,.1*sa),mL=P(.55*ca+.28*px,.55+dy,.55*sa+.28*pz),mR=P(.55*ca-.28*px,.55+dy,.55*sa-.28*pz),tip=P(1.0*ca,1.05+dy-drop*.4,1.0*sa);
    poly([base,mL,tip],C(o.tag?'petal':'',PET[k]),.82*pa,T('petal'));poly([base,tip,mR],C(o.tag?'petal':'',PET[k]),.82*pa,T('petal'));}
  const sa=1-fr;
  if(sa>.05)for(let k=0;k<6;k++){const a=k/6*2*Math.PI+.25,tipP=P(.48*Math.cos(a),.98,.48*Math.sin(a));rod(P(.1*Math.cos(a),.3,.1*Math.sin(a)),tipP,.012*s,'#F4E3B0',sa);
    ellip(tipP,.07*s,.11*s,.07*s,C(o.tag?'anther':'','#E9A21F'),sa,T('anther'),4,6);
    if(o.pollen)for(let j=0;j<Math.round(o.pollen*5);j++)ball([tipP[0]+(HR(k*5+j,1)-.5)*.14*s,tipP[1]+(HR(k*5+j,2)-.5)*.16*s,tipP[2]+(HR(k*5+j,3)-.5)*.14*s],.022*s,'#FFD43B',1);}

const MS=[
 {t:'استكشف',k:'استكشاف حر',explore:true,scene:'flower'},
 {t:'رحلة حبة اللقاح',k:'المهمة ١ · دورة حياة النبات الزهري',scene:'flower',intro:'كيف تتكوّن البذرة؟ رتّب مسار حبة اللقاح: اضغط على أجزاء الزهرة بالترتيب.',seq:['anther','stigma','style','ovary'],
  hint:{anther:'أين تتكوّن حبوب اللقاح؟',stigma:'سطح لزج في أعلى الزهرة تسقط عليه حبوب اللقاح.',style:'أنبوب يصل الميسم بالمبيض.',ovary:'الجزء المنتفخ في الأسفل، وفيه البويضة.'},anim:'flower',
  q:'التفكير الناقد (من الكتاب): ما الذي يمكن أن يحدث لبعض النباتات البذرية لو اختفت الملقّحات فجأة؟',o:['لا تنتقل حبوب اللقاح، فلا يحدث الإخصاب ولا تتكوّن بذور، فيقل عدد النباتات الجديدة','تزداد البذور؛ لأن الملقّحات لن تأكلها','لا يتأثر النبات؛ لأن البذور تتكوّن دون تلقيح'],c:0,
  h:{1:'الملقّحات لا تأكل البذور؛ هي تنقل حبوب اللقاح. فماذا يحدث إن لم تنتقل؟',2:'راقب الرحلة: دون حبة لقاح على الميسم لا ينمو أنبوب اللقاح، ولا يحدث الإخصاب.'},
  rule:'<b>التكاثر في النباتات البذرية</b>تتكاثر النباتات البذرية عن طريق التكاثر الجنسي؛ حيث يندمج المشيج المذكر مع المشيج المؤنث. ويسمّى انتقال حبوب اللقاح من المتك إلى الميسم التلقيح، ويسمّى اندماج المشيجين الإخصاب. وتنمو البذرة من البويضة المخصبة، وعند توافر الظروف المناسبة تنمو البذرة وينتج نبات جديد.'},
 {t:'نوعا التلقيح',k:'المهمة ٢ · التلقيح الذاتي والخلطي',scene:'polli',intro:'زهرتان على نباتين منفصلين. شغّل وراقب كيف تنتقل حبوب اللقاح.',anim:'polli',
  q:'أختار الإجابة الصحيحة (من الكتاب): إنّ دور النحلة في عملية تكاثر نبات مغطّى البذور هو:',o:['صانع العسل','منتج','ناقل للثمار','ملقّح'],c:3,
  h:{0:'النحلة تصنع العسل فعلًا، لكن ما دورها في تكاثر النبات؟ راقب ما تحمله من زهرة إلى أخرى.',1:'المنتج هو النبات نفسه الذي يصنع غذاءه.',2:'النحلة لم تنقل ثمارًا؛ راقب الحبيبات الصفراء.'},
  rule:'<b>نوعا التلقيح</b>التلقيح نوعان: الأول يسمّى التلقيح الذاتي، وفيه تنتقل حبوب اللقاح من المتك إلى الميسم في الزهرة نفسها. والثاني يسمّى التلقيح الخلطي، وفيه تنتقل حبوب اللقاح من متك زهرة إلى ميسم زهرة أخرى. وتسمّى المخلوقات الحية التي تنقل حبوب اللقاح المُلقّحات، ومنها الطيور والحشرات.'},
 {t:'الصنوبر',k:'المهمة ٣ · دورة حياة النباتات المعرّاة البذور',scene:'pine',intro:'شجرة صنوبر ليس لها أزهار. شغّل وراقب كيف تتكوّن بذورها.',anim:'pine',
  q:'أقارن: أين تتكوّن البذور في الصنوبر؟ وأين تتكوّن في النبات الزهري؟',o:['في الصنوبر داخل المخاريط، وفي النبات الزهري داخل المبيض في الزهرة','في الاثنين داخل الأزهار','الصنوبر لا يكوّن بذورًا'],c:0,
  h:{1:'هل رأيت أزهارًا على شجرة الصنوبر؟',2:'رأيت بذور الصنوبر تسقط من المخروط.'},
  rule:'<b>مقارنة النباتات البذرية</b>النباتات المغطّاة البذور والنباتات المعرّاة البذور نوعان من النباتات الوعائية البذرية. تتكاثر النباتات المغطّاة البذور عن طريق أزهارها. أمّا النباتات المعرّاة البذور فليس لها أزهار، وهي تُنتج بذورها في مخاريط، ومنها مخاريط نبات الصنوبر.'},
 {t:'الحزازيات',k:'المهمة ٤ · دورة حياة نبات حزازي',scene:'moss',intro:'نباتات حزازية صغيرة على التربة الرطبة. ليس لها أزهار ولا بذور. شغّل وراقب كيف تتكاثر.',anim:'moss',
  q:'التفكير الناقد (من الكتاب): كيف تختلف دورة حياة نبات بذري عن دورة حياة نبات حزازي؟',o:['النبات البذري يتكاثر بالبذور، والحزازي يتكاثر بالأبواغ ويتعاقب في دورته طوران: جاميتي وبوغي','الحزازي يكوّن أزهارًا وبذورًا مثل النبات البذري','لا فرق بينهما'],c:0,
  h:{1:'هل رأيت أزهارًا أو بذورًا في الحزازيات؟ ماذا خرج من المحفظة؟',2:'قارن: في الزهرة تكوّنت بذرة، وفي الحزازي خرجت أبواغ.'},
  rule:'<b>دورة حياة الحزازيات</b>الحزازيات والسرخسيات نباتات لا بذرية تتكاثر بالأبواغ. وتمرّ دورة حياتها بمرحلتين رئيستين: مرحلة التكاثر اللاجنسي حيث يُنتج النبات الأبواغ، وتسمّى الطور البوغي. ومرحلة التكاثر الجنسي، وتسمّى الطور الجاميتي، ويحتاج فيها النبات إلى مشيج مذكر ومشيج مؤنث لكي يتكاثر. وتسمّى العملية المستمرة للانتقال بين المرحلتين ظاهرة تعاقب الأجيال.'},
 {t:'أقارن',k:'المهمة ٥ · مقارنة دورات الحياة',scene:'cmp',intro:'صنّف كل صفة: لأي نبات هي؟',sort:'cmp',
  q:'أتوقّع: وجدتَ نباتًا له مخاريط وليس له أزهار. كيف يتكاثر؟',o:['بالبذور التي تتكوّن في المخاريط','بالبذور التي تتكوّن في المبيض','بالأبواغ فقط'],c:0,
  h:{1:'المبيض جزء من الزهرة، وهذا النبات ليس له أزهار.',2:'النبات الذي له مخاريط نبات بذري.'},
  rule:'<b>دورات حياة النباتات</b>لكل نبات دورة حياة: ينمو ويتكاثر ثم يموت. النبات الزهري (مغطّى البذور) يتكاثر بأزهاره وتنمو البذرة داخل المبيض، والصنوبر (معرّى البذور) يُنتج بذوره في مخاريط، والحزازيات نباتات لا بذرية تتكاثر بالأبواغ ويتعاقب في دورتها طوران.'}];
const done=new Set();
function nav(){$('#ms').innerHTML=MS.map((m,i)=>`<button type="button" data-m="${i}" class="${i===S.mi?'on':''} ${done.has(i)?'done':''}">${done.has(i)?'✓ ':''}${m.t}</button>`).join('');$('#ms').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>open(+b.dataset.m));}
const toast=t=>{const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,2800);};
let seqI=0,sortN=0;
function open(i){S.tour=null;S.mi=i;S.sel=null;S.selAt=null;S.flash=null;seqI=0;sortN=0;const m=MS[i],c=$('#cin');S.scene=m.scene;nav();
  if(m.explore){renderExplore();return;}
  let task='';if(m.seq)task=`<p class="step">اضغط على أجزاء الزهرة بالترتيب في المجسّم:</p><div class="seq" id="sq">${m.seq.map((k,j)=>`<span>${ar(j+1)}</span>`).join('')}</div><p class="fb" id="sf"></p>`;
  else if(m.sort){const so=SORTS[m.sort];task=`<div class="srt">${so.items.map(([t,a],j)=>`<div class="srow" data-r="${j}"><span>${t}</span><span class="sbt">${so.bins.map((b,k)=>`<button type="button" class="obtn" data-b="${k}">${b}</button>`).join('')}</span></div>`).join('')}</div><p class="fb" id="sf"></p>`;}
  else task=`<button class="go" type="button" id="play">▶ شغّل</button>`;
  c.innerHTML=`<div class="hd"><div><p class="kick">${m.k}</p><h2>${m.t}</h2></div><button class="tg" type="button" id="mn" aria-label="تصغير البطاقة">▾</button></div>
   <div class="dots" id="dt"></div>
   <div class="pane" id="p1"><p class="lead">${m.intro}</p>${task}</div>
   <div class="pane" id="watch" hidden></div>
   <div class="pane" id="qq" hidden><p class="step">${m.q}</p><div class="opts">${m.o.map((o,k)=>`<button class="opt" type="button" data-q="${k}">${o}</button>`).join('')}</div><p class="fb" id="qf"></p>${m.anim?`<button class="go full" type="button" id="replay2" style="background:transparent;color:var(--accent);border:1.5px solid var(--accent)">↺ شاهد الرحلة مرة أخرى</button>`:''}</div>
   <div class="pane" id="rr" hidden><p class="fb ok">✓ صحيح!</p><p class="rule">${m.rule}</p>${i<MS.length-1?`<button class="go" type="button" id="nx">المهمة التالية ←</button>`:`<p class="small">أنهيت المهام. انتقل إلى «استكشف» لتراجع أجزاء الزهرة.</p>`}</div>
   <p class="src">📖 الكتاب ص٨٤–٨٧</p>`;
  pane(1);$('#mn').onclick=()=>mini(!$('.card').classList.contains('mini'));
  if($('#play'))$('#play').onclick=()=>{$('#play').disabled=true;startAnim();};
  if($('#replay2'))$('#replay2').onclick=()=>startTour(m.anim);
  if(m.sort){const so=SORTS[m.sort];c.querySelectorAll('.srow').forEach(r=>{const j=+r.dataset.r,[t,a,why]=so.items[j];r.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const f=$('#sf');
    if(+b.dataset.b===a){b.classList.add('got');r.querySelectorAll('[data-b]').forEach(x=>x.disabled=true);r.classList.add('ok');sortN++;f.className='fb ok';f.textContent='صحيح. '+why;if(sortN===so.items.length){f.textContent='أحسنت! صنّفت الصفات كلها.';startAnim();}}
    else{b.disabled=true;b.style.opacity=.4;f.className='fb bad';f.textContent='«'+t+'» ليست صفة '+so.bins[+b.dataset.b]+'. '+why;}});});}
  c.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const k=+b.dataset.q,f=$('#qf');if(k===m.c){b.classList.add('right');c.querySelectorAll('[data-q]').forEach(x=>x.disabled=true);done.add(i);nav();pane(4);const nx=$('#nx');if(nx)nx.onclick=()=>open(i+1);}
    else{b.classList.add('wrong');b.disabled=true;f.className='fb bad';f.textContent=m.h[k]||'راقب الرحلة مرة أخرى.';}});}
function startAnim(){const m=MS[S.mi];if(m.anim){const k=m.anim;setTimeout(()=>startTour(k),600);}else setTimeout(()=>pane(3),700);}
const SMALL=()=>W<900;
function mini(on){const c=$('.card');c.classList.toggle('mini',!!on);const b=$('#mn');if(b){b.textContent=on?'▴':'▾';b.setAttribute('aria-label',on?'تكبير البطاقة':'تصغير البطاقة');}}
function pane(n){const m=MS[S.mi];['p1','watch','qq','rr'].forEach((id,k)=>{const e=$('#'+id);if(e)e.hidden=k+1!==n;});
  const lab=['أنفّذ','أراقب','أستنتج','القاعدة'];$('#dt').innerHTML=lab.map((l,k)=>`<i class="${k+1<n?'d':k+1===n?'c':''}"></i>`).join('')+`<span>${ar(n)}/٤ · ${lab[n-1]}</span>`;
  mini(SMALL()&&n===1&&!!m.seq);$('.cin').scrollTop=0;}
function renderExplore(){const c=$('#cin');const all=Object.keys(ORG);mini(false);
  c.innerHTML=`<p class="kick">استكشاف حر</p><h2>أجزاء النبات الزهري</h2><p class="lead">${S.sel?'':'اضغط على أي جزء من الزهرة في المجسّم، أو على اسمه هنا، لتعرف وظيفته في التكاثر.'}</p>
   ${S.sel?`<p class="info"><b>${ORG[S.sel].n}</b>${ORG[S.sel].d}</p>`:''}
   <p class="small">اكتشفت <b>${ar(S.seen.size)}</b> من ${ar(all.length)}.</p>
   <div class="chips">${all.map(k=>`<button type="button" class="obtn ${S.sel===k?'sel':S.seen.has(k)?'got':''}" data-org="${k}">${S.seen.has(k)?'✓ ':''}${ORG[k].n}</button>`).join('')}</div>
   <button class="go full" type="button" id="st1">ابدأ «رحلة حبة اللقاح» ←</button><p class="src">📖 الكتاب ص٨٤–٨٥</p>`;$('#st1').onclick=()=>open(1);
  c.querySelectorAll('[data-org]').forEach(b=>b.onclick=()=>{const k=b.dataset.org;S.sel=k;S.selAt=POS[k];S.seen.add(k);renderExplore();c.scrollTop=0;});}
/* الضغط */
function tagAt(x,y){const inP=(p)=>{let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){if(((p[i][1]>y)!==(p[j][1]>y))&&(x<(p[j][0]-p[i][0])*(y-p[i][1])/(p[j][1]-p[i][1])+p[i][0]))c=!c;}return c;};
  const dS=(a,b)=>{const vx=b[0]-a[0],vy=b[1]-a[1],t=Math.max(0,Math.min(1,((x-a[0])*vx+(y-a[1])*vy)/((vx*vx+vy*vy)||1)));return Math.hypot(x-a[0]-vx*t,y-a[1]-vy*t);};
  const LOW={petal:1,ovary:2,needles:1};let low=null;for(let i=HIT.length-1;i>=0;i--){const h=HIT[i];const ok=h.poly?inP(h.poly):h.c?Math.hypot(x-h.c[0],y-h.c[1])<h.c[2]:dS(h.seg[0],h.seg[1])<h.seg[2];if(!ok)continue;if(LOW[h.tag]){if(!low||LOW[h.tag]>LOW[low])low=h.tag;continue;}return h.tag;}return low;}
function tap(x,y){if(S.tour)return;const k=tagAt(x,y);if(!k)return;const m=MS[S.mi];
  if(m.explore){S.sel=k;S.selAt=POS[k];S.seen.add(k);renderExplore();$('#cin').scrollTop=0;return;}
  S.sel=k;S.selAt=POS[k];
  if(m.seq&&seqI<m.seq.length){const f=$('#sf');if(k===m.seq[seqI]){const sp=$('#sq').children[seqI];sp.className='f';sp.textContent=ORG[k].n;seqI++;f.className='fb ok';f.textContent='صحيح: '+ORG[k].n+'.';if(seqI===m.seq.length){f.textContent='أحسنت! رتّبت المسار. شاهد الرحلة.';startAnim();}}
    else{f.className='fb bad';f.textContent=(seqI===0?'ليس من هنا تبدأ. ':'ليس بعد «'+ORG[m.seq[seqI-1]].n+'». ')+'تلميح: '+m.hint[m.seq[seqI]];}}
  else if(INFO(k))toast(INFO(k).n+': '+INFO(k).d);}
const ptr=new Map();let moved=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;});
cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const [px,py]=ptr.get(e.pointerId);const dx=e.clientX-px,dy=e.clientY-py;moved+=Math.abs(dx)+Math.abs(dy);ptr.set(e.pointerId,[e.clientX,e.clientY]);cam.yaw-=dx*.008;cam.pitch=Math.max(-.4,Math.min(1.1,cam.pitch+dy*.006));S.drag=performance.now();});
cv.addEventListener('pointerup',e=>{ptr.delete(e.pointerId);if(moved<6)tap(e.clientX,e.clientY);});cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
cv.addEventListener('wheel',e=>{e.preventDefault();S.zoom=Math.max(.5,Math.min(2,(S.zoom||1)*(1+Math.sign(e.deltaY)*.07)));},{passive:false});

/* الحلقة */
function frame(ms){place();const sc=SCN[S.scene];const f=S.tour&&S.focus?S.focus:null;const tgt=f?mix3(sc.t,f,.5):sc.t;for(let i=0;i<3;i++)cam.t[i]+=(tgt[i]-cam.t[i])*(reduce?1:.05);cam.dist+=(sc.d*(S.zoom||1)-cam.dist)*(reduce?1:.06);
  cx.setTransform(DPR,0,0,DPR,0,0);const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#BFE3F5');g.addColorStop(1,'#EEF6E3');cx.fillStyle=g;cx.fillRect(0,0,W,H);
  const idle=!S.drag||performance.now()-S.drag>2500;if(idle&&!reduce)cam.yaw+=(Math.sin(ms/4500)*.45-cam.yaw)*.01;
  scene(ms/1000);drawTour(ms/1000);flush();requestAnimationFrame(frame);}

/* سحب البطاقة */
(()=>{const g=$('#grip'),card=$('.card');let d=null;
  const clamp=(x,y)=>{const r=card.getBoundingClientRect();return [Math.max(4,Math.min(innerWidth-r.width-4,x)),Math.max(4,Math.min(innerHeight-60,y))];};
  g.addEventListener('pointerdown',e=>{g.setPointerCapture(e.pointerId);const r=card.getBoundingClientRect();d={dx:e.clientX-r.left,dy:e.clientY-r.top,w:r.width,moved:0};});
  g.addEventListener('pointermove',e=>{if(!d)return;d.moved++;if(!card.classList.contains('moved')){card.classList.add('moved');card.style.width=d.w+'px';card.style.insetInline='auto';card.style.right='auto';card.style.bottom='auto';}
    card.classList.add('drag');const [x,y]=clamp(e.clientX-d.dx,e.clientY-d.dy);card.style.left=x+'px';card.style.top=y+'px';});
  const end=()=>{d=null;card.classList.remove('drag');};g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
  const reset=()=>{card.classList.remove('moved');['width','insetInline','right','bottom','left','top'].forEach(k=>card.style[k]='');};
  g.addEventListener('dblclick',reset);
  g.addEventListener('keydown',e=>{const st={ArrowUp:[0,-20],ArrowDown:[0,20],ArrowLeft:[-20,0],ArrowRight:[20,0]}[e.key];if(e.key==='Escape'){reset();return;}if(!st)return;e.preventDefault();const r=card.getBoundingClientRect();
    if(!card.classList.contains('moved')){card.classList.add('moved');card.style.width=r.width+'px';card.style.insetInline='auto';card.style.right='auto';card.style.bottom='auto';}const [x,y]=clamp(r.left+st[0],r.top+st[1]);card.style.left=x+'px';card.style.top=y+'px';});
  addEventListener('resize',()=>{if(card.classList.contains('moved')){const r=card.getBoundingClientRect();const [x,y]=clamp(r.left,r.top);card.style.left=x+'px';card.style.top=y+'px';}});})();
open(0);requestAnimationFrame(frame);
})();
</script>
