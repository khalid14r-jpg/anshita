<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>داخل الخلية النباتية</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--panel:rgba(14,26,18,.86);--ink:#EAF5EC;--muted:#A9C2AF;--line:rgba(255,255,255,.14);--accent:#7BD88A;--ok:#4ADE80;--ok-bg:rgba(34,120,60,.35);--bad:#FDBA74;--bad-bg:rgba(160,70,20,.35);
 --display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif;--body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0;direction:rtl}
body{background:#050C07;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;overflow:hidden}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}#cv:active{cursor:grabbing}
.top{position:fixed;top:0;inset-inline:0;z-index:5;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;pointer-events:none}
.top>*{pointer-events:auto}
h1{margin:0;font:800 clamp(1.05rem,3vw,1.45rem)/1.25 var(--display);background:var(--panel);padding:5px 16px 3px;border-radius:99px;border:1px solid var(--line);backdrop-filter:blur(8px)}
h1 small{font:600 .72rem var(--body);color:#FFD27A;margin-inline-start:6px}
.pill{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 .82rem var(--body);padding:6px 12px;border-radius:99px;cursor:pointer;text-decoration:none;backdrop-filter:blur(8px)}
.pill b{color:var(--accent)}
.card{position:fixed;z-index:6;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.45)}
@media (min-width:760px){.card{inset-inline-end:16px;top:72px;bottom:16px;width:min(400px,36vw);border-radius:22px;overflow:auto}}
@media (max-width:759px){.card{inset-inline:0;bottom:0;max-height:44vh;border-radius:22px 22px 0 0;overflow:auto;padding-bottom:env(safe-area-inset-bottom,0px)}}
.cin{padding:16px 18px 18px;display:grid;gap:9px}
.cin p{margin:0}.kick{color:var(--accent);font-weight:700;font-size:.85rem}
.cin h2{margin:0;font:800 1.35rem/1.25 var(--display)}
.hint{color:var(--muted);font-size:.9rem}
.info{background:rgba(123,216,138,.12);border:1px solid rgba(123,216,138,.35);border-radius:14px;padding:9px 12px}.info b{display:block;color:var(--accent);font-size:1.05rem}
.go{border:0;background:linear-gradient(135deg,#5CCB6E,#2F8A3E);color:#fff;font:800 1.05rem var(--body);padding:12px;border-radius:14px;cursor:pointer;box-shadow:0 6px 20px rgba(47,138,62,.45)}
.parts{display:flex;flex-wrap:wrap;gap:6px}.parts button{border:1.5px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);font:600 .85rem var(--body);padding:4px 11px;border-radius:99px;cursor:pointer}
.parts button.got{border-color:var(--ok);color:var(--ink);background:var(--ok-bg)}.parts button.on{outline:2px solid #FFD27A;outline-offset:1px}
.cnt{font-size:.85rem;color:var(--muted)}
.row{display:flex;gap:6px;flex-wrap:wrap}.tg{flex:1;min-width:150px;border:1.5px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font:700 .88rem var(--body);padding:8px 10px;border-radius:12px;cursor:pointer}
.q{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:10px}.q>p:first-child{font-weight:700}
.opt{text-align:start;border:1.5px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font:600 .92rem var(--body);padding:8px 12px;border-radius:12px;cursor:pointer}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}.opt.wrong{border-color:var(--bad);background:var(--bad-bg);opacity:.85}
.fb{font-size:.92rem;border-radius:10px;padding:0}.fb.ok{background:var(--ok-bg);padding:8px 10px}.fb.bad{background:var(--bad-bg);padding:8px 10px}
.cr{font-size:.75rem;color:var(--muted);text-align:center;margin-top:4px}
#labels{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.lbl{position:absolute;left:0;top:0;background:rgba(8,16,10,.82);color:#F2FFF4;font:700 13px var(--body);padding:3px 11px;border-radius:99px;white-space:nowrap;border:1px solid rgba(255,255,255,.25);opacity:0}
.lbl.pin{background:#FFD27A;color:#1B2A10;border-color:#fff;font-size:14px}
.lbl.pin:after{content:"";position:absolute;left:50%;bottom:-7px;width:2px;height:7px;background:#FFD27A;transform:translateX(-50%)}
#toast{position:fixed;z-index:8;top:64px;left:50%;transform:translateX(-50%);background:#FFD27A;color:#1B2A10;font-weight:700;font-size:.9rem;padding:8px 16px;border-radius:14px;max-width:min(92vw,520px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
@media (max-width:759px){#toast{top:auto;bottom:calc(44vh + 12px)}}
#load{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:#050C07;color:var(--ink);font:700 1.1rem var(--body)}
</style>
<canvas id="cv" aria-label="نموذج ثلاثي الأبعاد واقعي لخلية نباتية داخل نسيج ورقة"></canvas>
<div id="labels" aria-hidden="true"></div>
<div class="top"><h1>🌿 داخل الخلية النباتية<small>نسخة تجريبية</small></h1><button class="pill" id="qbtn" type="button"></button><a class="pill" href="plant.html">النسخة الحالية ↗</a></div>
<aside class="card"><div class="cin" id="cin" aria-live="polite"></div><p class="cr">إعداد وتصميم: أ. خالد رفيع الحمدي</p></aside>
<div id="toast" role="status" hidden></div>
<div id="load">⏳ جارٍ تجهيز الخلية…</div>
<script type="module">
try{window.THREE=await import('./three.module.min.js');window.ADD=await import('./three-addons.min.js');}
catch(e){document.getElementById('load').textContent='تعذّر تحميل المحرّك: تأكّد من رفع الملفين three.module.min.js و three-addons.min.js مع هذه الصفحة.';throw e;}
/* داخل الخلية النباتية — نسخة الجودة العالية (تجريبية) */
const $=s=>document.querySelector(s),ar=n=>Number(n).toLocaleString('ar-SA');
const T=window.THREE,A=window.ADD;
const {EffectComposer,RenderPass,UnrealBloomPass,BokehPass,OutputPass,ShaderPass,RoomEnvironment,RoundedBoxGeometry,OrbitControls}=A;
const isMob=()=>innerWidth<760;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ===== المشهد ===== */
const cv=$('#cv');
const R=new T.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
R.outputColorSpace=T.SRGBColorSpace;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.0;
R.localClippingEnabled=true;R.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();
const cam=new T.PerspectiveCamera(38,1,.05,120);
const ctl=new OrbitControls(cam,cv);ctl.enableDamping=true;ctl.dampingFactor=.08;ctl.enablePan=false;ctl.rotateSpeed=.7;ctl.zoomSpeed=.8;

const pm=new T.PMREMGenerator(R);scene.environment=pm.fromScene(new RoomEnvironment(),.04).texture;
scene.environmentIntensity=.55;

/* خلفية: توهّج أخضر داكن كأننا داخل ورقة */
const mkCanvas=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return c;};
const bgTex=new T.CanvasTexture(mkCanvas(512,512,(g,w,h)=>{const r=g.createRadialGradient(w*.55,h*.4,10,w*.5,h*.5,w*.75);r.addColorStop(0,'#2E5A35');r.addColorStop(.45,'#14301C');r.addColorStop(1,'#050C07');g.fillStyle=r;g.fillRect(0,0,w,h);}));
bgTex.colorSpace=T.SRGBColorSpace;scene.background=bgTex;
scene.fog=new T.FogExp2('#0A1A10',.028);

/* أضواء: ضوء الشمس الدافئ من أعلى، وضوء خلفي بارد */
scene.add(new T.HemisphereLight('#E9FFE6','#1D3A24',.55));
const sun=new T.DirectionalLight('#FFF1D2',2.4);sun.position.set(5,9,7);sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-5,right:5,top:5,bottom:-5,near:1,far:30});sun.shadow.bias=-.0006;sun.shadow.radius=4;scene.add(sun);
const rim=new T.DirectionalLight('#9CC7FF',.9);rim.position.set(-7,2,-6);scene.add(rim);
const fillL=new T.PointLight('#CFFFB8',1.2,9,2);fillL.position.set(.6,.4,2.4);scene.add(fillL);

/* ===== أنسجة إجرائية ===== */
const tex=(c,srgb=true,rep=[1,1])=>{const t=new T.CanvasTexture(c);if(srgb)t.colorSpace=T.SRGBColorSpace;t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(...rep);t.anisotropy=4;return t;};
const H01=(i,k=1)=>{const v=Math.sin(i*12.9898+k*78.233)*43758.5453;return v-Math.floor(v);};
/* خريطة اتجاهات (Normal) من صورة ارتفاعات */
const toNormal=(src,str=2)=>{const w=src.width,h=src.height,d=src.getContext('2d').getImageData(0,0,w,h).data;
  return mkCanvas(w,h,(g)=>{const o=g.createImageData(w,h),H=(x,y)=>d[(((y+h)%h)*w+((x+w)%w))*4]/255;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const dx=(H(x+1,y)-H(x-1,y))*str,dy=(H(x,y+1)-H(x,y-1))*str,l=Math.hypot(dx,dy,1),i=(y*w+x)*4;
      o.data[i]=(-dx/l*.5+.5)*255;o.data[i+1]=(dy/l*.5+.5)*255;o.data[i+2]=(1/l*.5+.5)*255;o.data[i+3]=255;}g.putImageData(o,0,0);});};
/* ألياف السليلوز في الجدار الخلوي */
const fiberH=mkCanvas(256,256,(g,w,h)=>{g.fillStyle='#808080';g.fillRect(0,0,w,h);g.lineCap='round';
  for(let i=0;i<260;i++){const a=(H01(i)-.5)*.9+(i%2?0:Math.PI/2),x=H01(i,2)*w,y=H01(i,3)*h,L=40+H01(i,4)*120;
    g.strokeStyle=`rgba(${H01(i,5)>.5?255:0},${H01(i,5)>.5?255:0},${H01(i,5)>.5?255:0},${.08+H01(i,6)*.18})`;g.lineWidth=1+H01(i,7)*3;
    for(const ox of [-w,0,w])for(const oy of [-h,0,h]){g.beginPath();g.moveTo(x+ox,y+oy);g.lineTo(x+ox+Math.cos(a)*L,y+oy+Math.sin(a)*L);g.stroke();}}});
const fiberN=tex(toNormal(fiberH,3),false,[2,3]);
/* البلاستيدة الخضراء: أكوام الجرانا والأغشية */
const chlC=tex(mkCanvas(256,128,(g,w,h)=>{const r=g.createLinearGradient(0,0,0,h);r.addColorStop(0,'#3FAE4F');r.addColorStop(.5,'#2C8A3B');r.addColorStop(1,'#3FAE4F');g.fillStyle=r;g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(190,255,170,.35)';g.lineWidth=1.2;for(let i=0;i<9;i++){g.beginPath();for(let x=0;x<=w;x+=8)g.lineTo(x,h*.12+i*h*.095+Math.sin(x*.05+i)*2.5);g.stroke();}
  for(let i=0;i<14;i++){const x=(i%7)*w/7+18+(i>6?16:0),y=h*(i>6?.66:.34);for(let k=0;k<5;k++){g.fillStyle=k%2?'#1B6A2A':'#145A22';g.beginPath();g.ellipse(x,y-10+k*5,11,2.6,0,0,7);g.fill();}}}));
const chlN=tex(toNormal(mkCanvas(256,128,(g,w,h)=>{g.fillStyle='#808080';g.fillRect(0,0,w,h);for(let i=0;i<14;i++){const x=(i%7)*w/7+18+(i>6?16:0),y=h*(i>6?.66:.34);g.fillStyle='#B0B0B0';g.beginPath();g.ellipse(x,y,12,13,0,0,7);g.fill();}}),2),false);
/* الميتوكندريا: الأعراف الداخلية */
const mitC=tex(mkCanvas(128,64,(g,w,h)=>{g.fillStyle='#E67A2E';g.fillRect(0,0,w,h);g.strokeStyle='#FFC08A';g.lineWidth=3;for(let i=0;i<9;i++){g.beginPath();const x=8+i*14;g.moveTo(x,0);g.bezierCurveTo(x+9,h*.3,x-9,h*.7,x,h);g.stroke();}}));
/* النواة: حبيبات الكروماتين */
const nucH=mkCanvas(256,128,(g,w,h)=>{g.fillStyle='#808080';g.fillRect(0,0,w,h);for(let i=0;i<700;i++){g.fillStyle=`rgba(${H01(i)>.5?255:0},${H01(i)>.5?255:0},${H01(i)>.5?255:0},.25)`;g.beginPath();g.arc(H01(i,2)*w,H01(i,3)*h,1+H01(i,4)*3,0,7);g.fill();}});
const nucN=tex(toNormal(nucH,2.5),false);

/* ===== الأبعاد ===== */
const W=3.0,Hc=4.4,D=2.6,RAD=.6,WT=.13,MT=.05;   /* الخلية، سماكة الجدار، سماكة الغشاء */
const clip=new T.Plane(new T.Vector3(0,0,-1),60);   /* يقطع ما أمام z=cz */
const CL=[clip];

/* المواد: نسخة عالية (شفافية فيزيائية) ونسخة خفيفة */
const MATS=[];
const mat=(hi,lo)=>{const m={hi:new T.MeshPhysicalMaterial(hi),lo:new T.MeshStandardMaterial(lo)};MATS.push(m);return m;};
const wallM=mat({color:'#93CF70',roughness:.42,metalness:0,transmission:.62,thickness:.35,ior:1.45,clearcoat:.35,clearcoatRoughness:.4,normalMap:fiberN,normalScale:new T.Vector2(.5,.5),clippingPlanes:CL,attenuationColor:'#BFE8A0',attenuationDistance:1.2},
  {color:'#93CF70',roughness:.55,transparent:true,opacity:.42,normalMap:fiberN,clippingPlanes:CL,depthWrite:false});
const wallIn=mat({color:'#7DBE5C',roughness:.5,transmission:.4,thickness:.2,side:T.BackSide,clippingPlanes:CL},{color:'#7DBE5C',roughness:.6,side:T.BackSide,transparent:true,opacity:.35,clippingPlanes:CL,depthWrite:false});
const memM=mat({color:'#F6E9A6',roughness:.18,transmission:.85,thickness:.05,iridescence:.9,iridescenceIOR:1.35,iridescenceThicknessRange:[200,600],clippingPlanes:CL},
  {color:'#F6E9A6',roughness:.3,transparent:true,opacity:.28,clippingPlanes:CL,depthWrite:false});
const cytoM=mat({color:'#A9C987',roughness:.55,side:T.BackSide,clippingPlanes:CL,emissive:'#1C3216',emissiveIntensity:.2,sheen:.8,sheenColor:'#E8FFC0',clearcoat:.6,clearcoatRoughness:.35,normalMap:nucN,normalScale:new T.Vector2(.25,.25)},{color:'#A9C987',roughness:.7,side:T.BackSide,clippingPlanes:CL,emissive:'#1C3216',emissiveIntensity:.2});
const vacM=mat({color:'#E2F2FF',roughness:.05,transmission:1,thickness:.5,ior:1.25,iridescence:.45,iridescenceThicknessRange:[150,400],side:T.FrontSide,clippingPlanes:CL,attenuationColor:'#BFDFFF',attenuationDistance:3,specularIntensity:1},
  {color:'#BFDFFF',roughness:.1,transparent:true,opacity:.35,side:T.FrontSide,clippingPlanes:CL,depthWrite:false});
const vacCapM=mat({color:'#E2F2FF',roughness:.04,transmission:1,thickness:.5,ior:1.25,iridescence:.3,attenuationColor:'#BFDFFF',attenuationDistance:3},{color:'#BFDFFF',roughness:.1,transparent:true,opacity:.3,depthWrite:false});
const nucM=mat({color:'#9C7BCB',roughness:.4,clearcoat:.6,clearcoatRoughness:.3,sheen:.7,sheenColor:'#E5D2FF',normalMap:nucN,normalScale:new T.Vector2(.7,.7),transmission:.3,thickness:.9},{color:'#9C7BCB',roughness:.5,normalMap:nucN});
const nclM=mat({color:'#4E2F82',roughness:.5},{color:'#4E2F82',roughness:.6});
const chlM=mat({color:'#ffffff',map:chlC,normalMap:chlN,normalScale:new T.Vector2(.6,.6),roughness:.38,clearcoat:.5,clearcoatRoughness:.25,sheen:1,sheenColor:'#C6FFA6',emissive:'#1A7A2C',emissiveIntensity:.18,clippingPlanes:CL},
  {color:'#ffffff',map:chlC,roughness:.45,emissive:'#1A7A2C',emissiveIntensity:.18,clippingPlanes:CL});
const mitM=mat({color:'#ffffff',map:mitC,roughness:.45,clearcoat:.4,sheen:.6,sheenColor:'#FFD6B0',emissive:'#7A3510',emissiveIntensity:.12,clippingPlanes:CL},{color:'#ffffff',map:mitC,roughness:.55,emissive:'#7A3510',emissiveIntensity:.12,clippingPlanes:CL});
const grM=mat({color:'#F0DC86',roughness:.5,emissive:'#5A4A10',emissiveIntensity:.3,clippingPlanes:CL},{color:'#F0DC86',roughness:.6,emissive:'#5A4A10',emissiveIntensity:.3,clippingPlanes:CL});
/* حواف المقطع: الجدار والغشاء */
const capWall=new T.MeshStandardMaterial({color:'#6FB34C',roughness:.6,normalMap:fiberN,side:T.DoubleSide,transparent:true,opacity:0});
const capMem=new T.MeshStandardMaterial({color:'#FFF1A8',roughness:.3,emissive:'#8A7A20',emissiveIntensity:.5,side:T.DoubleSide,transparent:true,opacity:0});
/* الخلايا المجاورة */
const nbM=mat({color:'#8CC96A',roughness:.45,transmission:.55,thickness:.35,ior:1.45,normalMap:fiberN,normalScale:new T.Vector2(.5,.5),attenuationColor:'#BFE8A0',attenuationDistance:1.5},{color:'#8CC96A',roughness:.55,transparent:true,opacity:.4,normalMap:fiberN,depthWrite:false});
const nbFront=new T.MeshStandardMaterial({color:'#8CC96A',roughness:.5,transparent:true,opacity:.5,normalMap:fiberN,depthWrite:false});
const nbChl=mat({color:'#ffffff',map:chlC,roughness:.4,sheen:1,sheenColor:'#C6FFA6',emissive:'#1A7A2C',emissiveIntensity:.15},{color:'#ffffff',map:chlC,roughness:.5,emissive:'#1A7A2C',emissiveIntensity:.15});
const nbChlF=new T.MeshStandardMaterial({color:'#ffffff',map:chlC,roughness:.5,transparent:true,opacity:1,emissive:'#1A7A2C',emissiveIntensity:.15});

const MESHES=[];const add=(geo,m,tag,o={})=>{const me=new T.Mesh(geo,m.hi||m);me.userData.m=m.hi?m:null;me.userData.tag=tag;Object.assign(me,o);scene.add(me);MESHES.push(me);return me;};
const addI=(geo,m,n,tag)=>{const me=new T.InstancedMesh(geo,m.hi||m,n);me.userData.m=m.hi?m:null;me.userData.tag=tag;scene.add(me);MESHES.push(me);return me;};

/* ===== الخلية الرئيسة ===== */
const cell=new T.Group();
const wallO=add(new RoundedBoxGeometry(W,Hc,D,6,RAD),wallM,'wall');
const wallI=add(new RoundedBoxGeometry(W-WT*2,Hc-WT*2,D-WT*2,6,RAD-WT),wallIn,'wall');
const mem=add(new RoundedBoxGeometry(W-WT*2-.02,Hc-WT*2-.02,D-WT*2-.02,6,RAD-WT-.01),memM,'mem');
const cyto=add(new RoundedBoxGeometry(W-WT*2-MT*2,Hc-WT*2-MT*2,D-WT*2-MT*2,6,RAD-WT-MT),cytoM,'cyto');
/* الفجوة: كتلة كبيرة متموّجة قليلًا */
const VAC={c:new T.Vector3(.08,-.36,-.08),s:new T.Vector3(1.95,2.55,1.7)};
const vg=new RoundedBoxGeometry(VAC.s.x,VAC.s.y,VAC.s.z,10,.62);{const p=vg.attributes.position,v=new T.Vector3();for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);const k=1+.018*Math.sin(v.x*3.1+v.y*2.3)+.015*Math.sin(v.y*4.2-v.z*3.3);v.multiplyScalar(k);p.setXYZ(i,v.x,v.y,v.z);}vg.computeVertexNormals();}
const vac=add(vg,vacM,'vac');vac.position.copy(VAC.c);
/* النواة ونويّتها، مدفوعة إلى ركن الخلية بالفجوة */
const NUC={c:new T.Vector3(-.72,1.38,-.5),r:.44};
const nuc=add(new T.SphereGeometry(NUC.r,64,48),nucM,'nuc');nuc.position.copy(NUC.c);nuc.scale.set(1.08,.92,1);nuc.castShadow=true;
const ncl=add(new T.SphereGeometry(.15,32,24),nclM,'nuc');ncl.position.copy(NUC.c).add(new T.Vector3(.08,.03,.12));

/* مسار حول محيط الخلية (حركة السيتوبلازم) */
const rrect=(u,a,b,r)=>{const sa=2*(a-r),sb=2*(b-r),q=Math.PI*r/2,L=2*sa+2*sb+4*q;let s=((u%1)+1)%1*L;
  const segs=[[sb,(t)=>[a,-b+r+t],[1,0]],[q,(t)=>{const th=t/r;return [a-r+r*Math.cos(th),b-r+r*Math.sin(th)];},null],[sa,(t)=>[a-r-t,b],[0,1]],[q,(t)=>{const th=Math.PI/2+t/r;return [-a+r+r*Math.cos(th),b-r+r*Math.sin(th)];},null],

    if(k>=1){const v=VIEWS[S.fly.v];ctl.minDistance=v.min*fitK();ctl.maxDistance=v.max*fitK();S.fly=null;}}
  if(S.pend&&(TEST?tSim:now/1000)>=S.pend.at){S.pend=null;S.cut=true;S.czT=0;ui();}
  ctl.update();
  /* القطع التدريجي */
  S.cz+=((S.czT>50?S.czT:S.czT)-S.cz)*Math.min(1,dt*(S.czT>50?6:1.8));if(S.czT<50&&S.cz>D/2+.3)S.cz=D/2+.3;clip.constant=S.cz>D/2+.25&&S.czT>50?60:S.cz;
  const capOn=S.cut&&S.cz<.03;[cW,cM].forEach(m=>{m.visible=S.cut;m.position.z=Math.min(S.cz,0)+.001;m.material.opacity+=((capOn?1:0)-m.material.opacity)*Math.min(1,dt*5);});cMhit.visible=capOn;cMhit.position.z=.002;cV.visible=S.cut&&S.cz<VAC.c.z+VAC.s.z/2-.05;cV.position.z=Math.min(S.cz,0);
  /* إخفاء الصف الأمامي عند الدخول */
  const fT=S.mode==='cell'?0:1;S.fade+=(fT-S.fade)*Math.min(1,dt*2.5);nbFront.opacity=.5*S.fade;nbChlF.opacity=S.fade;nbWF.visible=nbCF.visible=S.fade>.02;
  animCell(t,dt*10);
  /* إبراز الجزء المختار */
  const pul=.5+.5*Math.sin(t*4);
  [[chlM,'chl',.18],[mitM,'mito',.12],[grM,'cyto',.3]].forEach(([m,k,b])=>{const v=S.sel===k?b+.5*pul:b;m.hi.emissiveIntensity=m.lo.emissiveIntensity=v;});
  [nucM.hi,nucM.lo].forEach(m=>{m.emissive.set('#5A2E9A');m.emissiveIntensity=S.sel==='nuc'?.35*pul:0;});
  [vacM.hi,vacM.lo].forEach(m=>{m.emissive.set('#3E7FD0');m.emissiveIntensity=S.sel==='vac'?.25*pul:0;});
  capWall.emissive.set('#5FAF3A');capWall.emissiveIntensity=S.sel==='wall'?.6*pul:0;capMem.emissiveIntensity=S.sel==='mem'?.5+1.2*pul:.5;
  [wallM.hi,wallM.lo].forEach(m=>{m.emissive.set('#4C9A2A');m.emissiveIntensity=S.sel==='wall'?.25*pul:0;});
  /* التسميات */
  place(lSel,S.sel?anchor(S.sel):V,S.mode==='cell'&&!!S.sel&&!S.fly,S.sel?PARTS[S.sel].n:'');
  place(lT1,P3.set(0,Hc/2+.15,D/2),S.mode==='tissue'&&!S.fly,'خلية واحدة');place(lT2,P3.set(-6.7,Hc/2+.3,-2.95),S.mode==='tissue'&&!S.fly,'خلايا متراصّة في طبقات');
  /* العمق الضبابي يتبع الهدف */
  if(noRender){}else if(composer&&HQ){bokeh.uniforms.focus.value=cam.position.distanceTo(ctl.target)*(S.mode==='cell'?.92:1);bokeh.uniforms.aperture.value=S.mode==='cell'?.0006:.0011;composer.render(dt);}else R.render(scene,cam);
  /* فحص السرعة مرة واحدة: إن كان الجهاز بطيئًا نتحوّل إلى الخفيفة */
  if(!checked&&HQ&&t>1.5){fpsN++;fpsT+=dt;if(fpsT>2.5){checked=true;if(fpsN/fpsT<26){HQ=false;applyQ();toast('تحوّلنا إلى الجودة الخفيفة لأن جهازك أبطأ. يمكنك تغييرها من زر الجودة.');}}}
  if(!TEST)requestAnimationFrame(()=>loop());}
$('#qbtn').onclick=()=>{HQ=!HQ;checked=true;store.set('cellhq-q',HQ?'hi':'lo');applyQ();};
applyQ();ui();$('#load').remove();if(TEST){checked=true;window.__step=(sec,dt=1/30)=>{const n=Math.round(sec/dt);for(let i=0;i<n;i++)loop(dt,i<n-1);};}else loop();
window.__S=S;window.__scr=k=>{const p=anchor(k).clone();if(k==='nuc')p.set(NUC.c.x,NUC.c.y,NUC.c.z+NUC.r);p.project(cam);const r=cv.getBoundingClientRect();return [(p.x*.5+.5)*r.width,(-p.y*.5+.5)*r.height];};window.__dive=dive;window.__select=select;window.__setQ=v=>{HQ=v;checked=true;applyQ();};

</script>
