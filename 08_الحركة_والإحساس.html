<style>

:root[data-theme="dark"]{--bg:#140D10;--panel:rgba(30,20,24,.95);--ink:#F2E8EA;--muted:#B9A5AA;--line:#3A2A30;--accent:#8EA8F0;--accent-soft:#1E2640;--ok:#4ADE80;--ok-bg:#12291C;--bad:#FB923C;--bad-bg:#2E1C10;color-scheme:dark}
html,body{direction:rtl}*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%}

.nav button{border:0;background:none;color:var(--muted);font:600 .85rem var(--body);padding:4px 11px;border-radius:99px;cursor:pointer}.nav button.on{background:var(--accent);color:#fff}.nav button.done{color:var(--ok)}

.who{display:flex;gap:2px;background:var(--panel);border-radius:99px;padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.15);pointer-events:auto}.who button{border:0;background:transparent;color:var(--ink);border-radius:99px;padding:3px 12px;font:700 .85rem var(--body);cursor:pointer}.who button.on{background:var(--accent);color:#fff}

#sys i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:5px}
.card{position:fixed;bottom:0;transition:transform .25s ease;inset-inline:0;z-index:6;margin:0 auto;max-width:620px;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}

.kick{margin:0;font-size:.78rem;font-weight:700;color:var(--accent)}h2{margin:0;font:800 1.25rem/1.3 var(--display)}
.lead{margin:0}.step{margin:0;font-weight:700}.small{margin:0;font-size:.85rem;color:var(--muted)}
.seq{display:flex;flex-wrap:wrap;gap:6px}.seq span{border:1.5px dashed var(--line);border-radius:10px;padding:2px 10px;font-size:.85rem;color:var(--muted);min-width:34px;text-align:center}.seq span.f{border-style:solid;border-color:var(--ok);background:var(--ok-bg);color:var(--ink);font-weight:600}
.opts{display:grid;gap:6px}.opt{text-align:start;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:8px 12px;font:500 .95rem var(--body);cursor:pointer}

.fb{margin:0;font-size:.92rem}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}

.row{display:flex;gap:8px;flex-wrap:wrap}

:focus-visible{outline:3px solid #F59F00;outline-offset:2px}
@media (min-width:900px){.card{inset-inline:auto;inset-inline-start:max(16px,env(safe-area-inset-right,0px));bottom:auto;top:calc(110px + env(safe-area-inset-top,0px));width:380px;padding:0}.cin{max-height:calc(100vh - 140px)}.hd .tg{display:none}}
.hd{display:flex;align-items:center;gap:8px}.hd>div{flex:1;min-width:0}.hd .tg{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;width:36px;height:32px;font-size:1rem;cursor:pointer;flex:none}
.dots{display:flex;gap:5px;align-items:center;font-size:.75rem;color:var(--muted)}.dots i{width:22px;height:5px;border-radius:9px;background:var(--line)}.dots i.c{background:var(--accent)}.dots i.d{background:var(--ok)}
.card.mini .lead,.card.mini .src,.card.mini .full{display:none}.card.mini h2{font-size:1rem}.card.mini .cin{gap:5px;padding:8px 14px}
.tstep{display:flex;align-items:center;gap:8px}.tstep b{font:800 1.15rem var(--display);color:var(--accent)}.tno{font-size:.75rem;background:var(--accent-soft);border-radius:99px;padding:1px 9px;font-variant-numeric:tabular-nums}
.ttx{margin:0;font-weight:600}.tfd{margin:0;font-size:.9rem;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:5px 10px}
.tnav{display:flex;gap:6px}.tb{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:9px 12px;font:700 .95rem var(--body);cursor:pointer}.tb:disabled{opacity:.4;cursor:default}.tb.go2{flex:1;background:var(--accent);color:#fff;border-color:var(--accent)}.tb.go2:disabled{background:var(--line);border-color:var(--line);color:var(--muted);opacity:1}
.grip{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;background:var(--panel);color:var(--muted);border-radius:14px 14px 0 0;padding:5px 0 3px;cursor:grab;touch-action:none;font:500 .72rem var(--body);margin-bottom:-12px;padding-bottom:14px;box-shadow:0 -2px 10px rgba(0,0,0,.12)}
.grip span{width:42px;height:5px;border-radius:9px;background:var(--line)}.grip:active{cursor:grabbing}.card.moved{margin:0;max-width:none;transition:none}.card.drag .cin{box-shadow:0 10px 34px rgba(0,0,0,.35)}
.olist{display:grid;gap:8px}.ogrp{display:grid;gap:4px}.ogrp b{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}.ogrp b i{width:9px;height:9px;border-radius:50%}
.obtn{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:2px 10px;font:600 .82rem var(--body);cursor:pointer}.obtn.got{border-color:var(--ok);background:var(--ok-bg)}.obtn.sel{border-color:var(--accent);background:var(--accent);color:#fff}
.ends{display:flex;justify-content:space-between;direction:ltr;font-size:.78rem;color:var(--muted)}.pulse{margin:0;font-size:1.05rem;background:var(--accent-soft);border-radius:10px;padding:6px 10px}
.hint2{margin:0;font-size:.85rem;color:var(--muted)}
.pane{display:grid;gap:8px}
@media (max-width:600px){h2{font-size:1.1rem}.cin{max-height:40vh}.nav button{padding:3px 8px;font-size:.8rem}}
</style>

<div id="stage"><canvas id="cv" aria-label="جسم إنسان ثلاثي الأبعاد يظهر فيه الهيكل والعضلات والأعصاب"></canvas></div>

<script>
(()=>{'use strict';document.documentElement.dir='rtl';document.documentElement.lang='ar';
const $=s=>document.querySelector(s),ar=n=>Number(n).toLocaleString('ar-SA');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=$('#cv'),cx=cv.getContext('2d');let W=0,H=0,DPR=1,CX0=0,CY0=0;
let AVH=600;const fit=()=>{DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);};
const place=()=>{const top=($('#sys')?.getBoundingClientRect().bottom||100)+8;if($('.card')?.classList.contains('moved')){CX0=W/2;AVH=H-top-10;CY0=top+AVH*.5;return;}if(W>=900){CX0=(W-400)/2;AVH=H-top-10;CY0=top+AVH*.52;}else{const b=$('.card .cin')?.getBoundingClientRect().top||H*.6;AVH=Math.max(160,b-top-6);CX0=W/2;CY0=top+AVH*.5;}};addEventListener('resize',fit);fit();

/* ===== محرّك ===== */
const cam={yaw:0,pitch:.08,dist:6.2,t:[0,1.0,0]};
const P=p=>{const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);const x=p[0]-cam.t[0],y=p[1]-cam.t[1],z=p[2]-cam.t[2];
  const x1=x*cy-z*sy,z1=x*sy+z*cy,y2=y*cp-z1*sp,z2=y*sp+z1*cp,d=cam.dist-z2,s=Math.min(W*1.05,AVH*1.18)/Math.max(d,.05);return [CX0+x1*s,CY0-y2*s,d,s];};
const LT=(()=>{const v=[-.4,.8,.6],n=Math.hypot(...v);return v.map(a=>a/n);})();
const rgb=h=>{const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];};
const col=(h,k)=>{const c=rgb(h).map(v=>Math.max(0,Math.min(255,Math.round(v*k))));return `rgb(${c[0]},${c[1]},${c[2]})`;};
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],crs=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
let Q=[],LB=[],HIT=[];
const poly=(pts,c,a=1,tag=null)=>Q.push({k:'p',pts,c,a,tag});
const ball=(p,r,c,a=1,tag=null)=>Q.push({k:'s',p,r,c,a,tag});
const rod=(p,q,r,c,a=1,tag=null)=>Q.push({k:'l',p,q,r,c,a,tag});
const label=(p,t)=>LB.push({p,t});
const flush=()=>{const it=[];HIT=[];for(const o of Q){if(o.k==='p'){o.pr=o.pts.map(P);o.d=o.pr.reduce((s,v)=>s+v[2],0)/o.pr.length;const nn=crs(sub(o.pts[1],o.pts[0]),sub(o.pts[2],o.pts[0])),L=Math.hypot(...nn)||1;o.sh=.62+.45*Math.abs((nn[0]*LT[0]+nn[1]*LT[1]+nn[2]*LT[2])/L);}
    else if(o.k==='s'){o.pr=P(o.p);o.d=o.pr[2];}else{o.pa=P(o.p);o.pb=P(o.q);o.d=(o.pa[2]+o.pb[2])/2;}it.push(o);}
  it.sort((a,b)=>b.d-a.d);
  for(const o of it){cx.globalAlpha=o.a;let h=null;
    if(o.k==='p'){cx.beginPath();o.pr.forEach((v,i)=>i?cx.lineTo(v[0],v[1]):cx.moveTo(v[0],v[1]));cx.closePath();cx.fillStyle=col(o.c,o.sh);cx.fill();if(o.tag)h={tag:o.tag,poly:o.pr};}
    else if(o.k==='s'){const [x,y,,s]=o.pr,r=Math.max(.5,o.r*s);const g=cx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);g.addColorStop(0,col(o.c,1.45));g.addColorStop(.6,col(o.c,1));g.addColorStop(1,col(o.c,.6));cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r,0,7);cx.fill();if(o.tag)h={tag:o.tag,c:[x,y,r+3]};}
    else{const w=Math.max(1.2,o.r*(o.pa[3]+o.pb[3]));cx.strokeStyle=col(o.c,1);cx.lineCap='round';cx.lineWidth=w;cx.beginPath();cx.moveTo(o.pa[0],o.pa[1]);cx.lineTo(o.pb[0],o.pb[1]);cx.stroke();if(o.tag)h={tag:o.tag,seg:[o.pa,o.pb,w/2+5]};}
    if(h)HIT.push(h);}
  cx.globalAlpha=1;Q=[];
  cx.font='600 12.5px "IBM Plex Sans Arabic",system-ui,sans-serif';cx.direction='rtl';cx.textBaseline='middle';cx.textAlign='center';
  for(const l of LB){const [x,y]=P(l.p);const w=cx.measureText(l.t).width+14,lx=Math.min(W-w/2-6,Math.max(w/2+6,x)),ly=y-22;cx.strokeStyle='rgba(255,255,255,.8)';cx.lineWidth=1.2;cx.beginPath();cx.moveTo(x,y);cx.lineTo(lx,ly+10);cx.stroke();
    cx.fillStyle='rgba(30,14,18,.88)';cx.beginPath();cx.roundRect?cx.roundRect(lx-w/2,ly-11,w,22,8):cx.rect(lx-w/2,ly-11,w,22);cx.fill();cx.fillStyle='#FBEFF1';cx.fillText(l.t,lx,ly);}LB=[];};
const ellip=(c,rx,ry,rz,colr,a,tag,NU=6,NV=10,rot=0)=>{const cr=Math.cos(rot),sr=Math.sin(rot);const S=(u,v)=>{const x=rx*Math.sin(u)*Math.cos(v),y=ry*Math.cos(u),z=rz*Math.sin(u)*Math.sin(v);return [c[0]+x*cr-y*sr,c[1]+x*sr+y*cr,c[2]+z];};
  for(let i=0;i<NU;i++)for(let j=0;j<NV;j++){const u0=i/NU*Math.PI,u1=(i+1)/NU*Math.PI,v0=j/NV*2*Math.PI,v1=(j+1)/NV*2*Math.PI;poly([S(u0,v0),S(u1,v0),S(u1,v1),S(u0,v1)],colr,a,tag);}};
const tube=(path,r,c,a,tag)=>{for(let i=0;i<path.length-1;i++)rod(path[i],path[i+1],r,c,a,tag);};
const along=(path,t)=>{const L=[0];for(let i=1;i<path.length;i++)L.push(L[i-1]+Math.hypot(...sub(path[i],path[i-1])));const T=Math.max(0,Math.min(1,t))*L[L.length-1];let i=1;while(i<L.length-1&&L[i]<T)i++;const k=(T-L[i-1])/((L[i]-L[i-1])||1);return path[i-1].map((v,j)=>v+(path[i][j]-v)*k);};
const HR=(i,k=1)=>{const v=Math.sin(i*12.9898+k*78.233)*43758.5453;return v-Math.floor(v);};

/* ===== التشريح: الحركة والإحساس ===== */
const PATH={};
const mix3=(a,b,t)=>a.map((v,j)=>v+(b[j]-v)*t);
const add=(p,d)=>[p[0]+d[0],p[1]+d[1],p[2]+d[2]];
const norm=v=>{const l=Math.hypot(...v)||1;return v.map(x=>x/l);};
const SYS={ske:{n:'الهيكلي',c:'#E9DFC4'},mus:{n:'العضلي',c:'#C8504E'},ner:{n:'العصبي',c:'#F2C94C'},end:{n:'الغدد الصمّاء',c:'#E67AA0'}};
const SH=[.82,2.2,0],EL=[1.0,1.25,.08],SHL=[-.82,2.2,0],ELL=[-1.0,1.25,.08],WRL=[-1.12,.35,.2];
const armDir=b=>{const th=b*2.3;return norm([.13*(1-b)-.12*b,-Math.cos(th),.35*Math.sin(th)+.13]);};
const WR=()=>add(EL,armDir(S.bend).map(v=>v*.92));
let ORG={skull:{n:'الجمجمة',s:['ske'],d:'قاسية جدًّا لكي تحمي الدماغ الحساس من الإصابة، كما أنها خفيفة الوزن؛ لكي يسهل إبقاء الرأس منتصبًا.',at:[0,3.6,.1]},
 spine:{n:'الفقرات',s:['ske'],d:'عظام العمود الفقري. والفقاريات، ومنها الإنسان، لها جهاز هيكلي يتكوّن من العظام والأربطة والأوتار.',at:[0,2.2,-.27]},
 ribs:{n:'القفص الصدري (الأضلاع)',s:['ske'],d:'يحمي القلب والرئتين.',at:[.55,1.9,.3]},
 pelvis:{n:'الحوض',s:['ske'],d:'عظم يدعم الجسم، وترتبط به عظام الفخذين.',at:[.3,.05,.2]},
 femur:{n:'عظم الفخذ',s:['ske'],d:'العظام نسيج صلب وخفيف وقوي، يكسب الجسم شكله ويساعده على الحركة.',at:[.33,-.7,0]},
 armb:{n:'عظام الذراع',s:['ske'],d:'العظام تتحرك بسهولة، لكنها لا تستطيع الحركة وحدها؛ فمصدر القوة التي تحركها هو الجهاز العضلي.',at:[.9,1.7,.04]},
 lig:{n:'الأربطة',s:['ske'],d:'نسيج يربط العظام بعضها ببعض.',at:[1.0,1.25,.08]},
 biceps:{n:'العضلة الأمامية للعضد',s:['mus'],d:'عندما تنقبض تسحب عظم الساعد فينثني الذراع، وعندها تنبسط العضلة الخلفية.',at:[.95,1.75,.18]},
 triceps:{n:'العضلة الخلفية للعضد',s:['mus'],d:'عندما تنقبض تسحب عظم الساعد فيُفرد الذراع، وعندها تنبسط العضلة الأمامية.',at:[.9,1.75,-.15]},
 tendon:{n:'الوتر',s:['mus'],d:'نسيج مرن قوي يربط العضلة بالعظم.',at:[1.02,1.12,.2]},
 thigh:{n:'عضلات الفخذ',s:['mus'],d:'العضلات تعمل في أزواج أو مجموعات متقابلة، وتحرّك الرجل عند المشي والقفز.',at:[-.33,-.6,.12]},
 brain:{n:'الدماغ',s:['ner'],d:'ينظّم حركات العضلات، ويفسّر المعلومات التي تصله من أعضاء الحس، وينظّم وظائف أعضاء الجسم.',at:[0,3.42,.05]},
 cord:{n:'الحبل الشوكي',s:['ner'],d:'يمرّر المعلومات من الدماغ وإليه.',at:[0,1.4,-.2]},
 nerves:{n:'الأعصاب',s:['ner'],d:'ترسل معلومات من أجزاء الجسم المختلفة إلى الدماغ.',at:[.9,1.75,0]},

function tagAt(x,y){const inP=(p)=>{let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){if(((p[i][1]>y)!==(p[j][1]>y))&&(x<(p[j][0]-p[i][0])*(y-p[i][1])/(p[j][1]-p[i][1])+p[i][0]))c=!c;}return c;};

(()=>{const g=$('#grip'),card=$('.card');let d=null;
  const clamp=(x,y)=>{const r=card.getBoundingClientRect();return [Math.max(4,Math.min(innerWidth-r.width-4,x)),Math.max(4,Math.min(innerHeight-60,y))];};
  g.addEventListener('pointerdown',e=>{g.setPointerCapture(e.pointerId);const r=card.getBoundingClientRect();d={dx:e.clientX-r.left,dy:e.clientY-r.top,w:r.width,moved:0};});
  g.addEventListener('pointermove',e=>{if(!d)return;d.moved++;if(!card.classList.contains('moved')){card.classList.add('moved');card.style.width=d.w+'px';card.style.insetInline='auto';card.style.right='auto';card.style.bottom='auto';}
    card.classList.add('drag');const [x,y]=clamp(e.clientX-d.dx,e.clientY-d.dy);card.style.left=x+'px';card.style.top=y+'px';});
  const end=()=>{d=null;card.classList.remove('drag');};g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
  const reset=()=>{card.classList.remove('moved');['width','insetInline','right','bottom','left','top'].forEach(k=>card.style[k]='');};
  g.addEventListener('dblclick',reset);
  g.addEventListener('keydown',e=>{const st={ArrowUp:[0,-20],ArrowDown:[0,20],ArrowLeft:[-20,0],ArrowRight:[20,0]}[e.key];if(e.key==='Escape'){reset();return;}if(!st)return;e.preventDefault();const r=card.getBoundingClientRect();
    if(!card.classList.contains('moved')){card.classList.add('moved');card.style.width=r.width+'px';card.style.insetInline='auto';card.style.right='auto';card.style.bottom='auto';}const [x,y]=clamp(r.left+st[0],r.top+st[1]);card.style.left=x+'px';card.style.top=y+'px';});
  addEventListener('resize',()=>{if(card.classList.contains('moved')){const r=card.getBoundingClientRect();const [x,y]=clamp(r.left,r.top);card.style.left=x+'px';card.style.top=y+'px';}});})();
open(0);requestAnimationFrame(frame);
})();
</script>
