<style>

html,body{direction:rtl}*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%}

.hd{display:flex;align-items:center;gap:8px}.hd>div{flex:1;min-width:0}.hd .tg{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;width:36px;height:32px;font-size:1rem;cursor:pointer;flex:none}

.hint2{margin:0;font-size:.85rem;color:var(--muted)}

<script>
(()=>{'use strict';document.documentElement.dir='rtl';document.documentElement.lang='ar';
const $=s=>document.querySelector(s),ar=n=>Number(n).toLocaleString('ar-SA');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=$('#cv'),cx=cv.getContext('2d');let W=0,H=0,DPR=1,CX0=0,CY0=0;
let AVH=600;const fit=()=>{DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);};
const place=()=>{const top=($('#sys')?.getBoundingClientRect().bottom||100)+8;if($('.card')?.classList.contains('moved')){CX0=W/2;AVH=H-top-10;CY0=top+AVH*.5;return;}if(W>=900){CX0=(W-400)/2;AVH=H-top-10;CY0=top+AVH*.52;}else{const b=$('.card .cin')?.getBoundingClientRect().top||H*.6;AVH=Math.max(160,b-top-6);CX0=W/2;CY0=top+AVH*.5;}};addEventListener('resize',fit);fit();

/* ===== محرّك ===== */
const cam={yaw:0,pitch:.12,dist:6.6,t:[0,.45,0]};
const P=p=>{const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);const x=p[0]-cam.t[0],y=p[1]-cam.t[1],z=p[2]-cam.t[2];
  const x1=x*cy-z*sy,z1=x*sy+z*cy,y2=y*cp-z1*sp,z2=y*sp+z1*cp,d=cam.dist-z2,s=Math.min(W*1.05,AVH*1.18)/Math.max(d,.05);return [CX0+x1*s,CY0-y2*s,d,s];};
const LT=(()=>{const v=[-.4,.8,.6],n=Math.hypot(...v);return v.map(a=>a/n);})();
const rgb=h=>{const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];};
const col=(h,k)=>{const c=rgb(h).map(v=>Math.max(0,Math.min(255,Math.round(v*k))));return `rgb(${c[0]},${c[1]},${c[2]})`;};
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],crs=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
let Q=[],LB=[],HIT=[];
const poly=(pts,c,a=1,tag=null)=>Q.push({k:'p',pts,c,a,tag});
const ball=(p,r,c,a=1,tag=null)=>Q.push({k:'s',p,r,c,a,tag});
const rod=(p,q,r,c,a=1,tag=null)=>Q.push({k:'l',p,q,r,c,a,tag});
const label=(p,t)=>LB.push({p,t});
const flush=()=>{const it=[];HIT=[];for(const o of Q){if(o.k==='p'){o.pr=o.pts.map(P);o.d=o.pr.reduce((s,v)=>s+v[2],0)/o.pr.length;const nn=crs(sub(o.pts[1],o.pts[0]),sub(o.pts[2],o.pts[0])),L=Math.hypot(...nn)||1;o.sh=.62+.45*Math.abs((nn[0]*LT[0]+nn[1]*LT[1]+nn[2]*LT[2])/L);}
    else if(o.k==='s'){o.pr=P(o.p);o.d=o.pr[2];}else{o.pa=P(o.p);o.pb=P(o.q);o.d=(o.pa[2]+o.pb[2])/2;}it.push(o);}
  it.sort((a,b)=>b.d-a.d);
  for(const o of it){cx.globalAlpha=o.a;let h=null;
    if(o.k==='p'){cx.beginPath();o.pr.forEach((v,i)=>i?cx.lineTo(v[0],v[1]):cx.moveTo(v[0],v[1]));cx.closePath();cx.fillStyle=col(o.c,o.sh);cx.fill();if(o.tag)h={tag:o.tag,poly:o.pr};}
    else if(o.k==='s'){const [x,y,,s]=o.pr,r=Math.max(.5,o.r*s);const g=cx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);g.addColorStop(0,col(o.c,1.45));g.addColorStop(.6,col(o.c,1));g.addColorStop(1,col(o.c,.6));cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r,0,7);cx.fill();if(o.tag)h={tag:o.tag,c:[x,y,r+3]};}
    else{const w=Math.max(1.2,o.r*(o.pa[3]+o.pb[3]));cx.strokeStyle=col(o.c,1);cx.lineCap='round';cx.lineWidth=w;cx.beginPath();cx.moveTo(o.pa[0],o.pa[1]);cx.lineTo(o.pb[0],o.pb[1]);cx.stroke();if(o.tag)h={tag:o.tag,seg:[o.pa,o.pb,w/2+5]};}
    if(h)HIT.push(h);}
  cx.globalAlpha=1;Q=[];
  cx.font='600 12.5px "IBM Plex Sans Arabic",system-ui,sans-serif';cx.direction='rtl';cx.textBaseline='middle';cx.textAlign='center';
  for(const l of LB){const [x,y]=P(l.p);const w=cx.measureText(l.t).width+14,lx=Math.min(W-w/2-6,Math.max(w/2+6,x)),ly=y-22;cx.strokeStyle='rgba(255,255,255,.8)';cx.lineWidth=1.2;cx.beginPath();cx.moveTo(x,y);cx.lineTo(lx,ly+10);cx.stroke();
    cx.fillStyle='rgba(30,14,18,.88)';cx.beginPath();cx.roundRect?cx.roundRect(lx-w/2,ly-11,w,22,8):cx.rect(lx-w/2,ly-11,w,22);cx.fill();cx.fillStyle='#FBEFF1';cx.fillText(l.t,lx,ly);}LB=[];};
const ellip=(c,rx,ry,rz,colr,a,tag,NU=6,NV=10,rot=0)=>{const cr=Math.cos(rot),sr=Math.sin(rot);const S=(u,v)=>{const x=rx*Math.sin(u)*Math.cos(v),y=ry*Math.cos(u),z=rz*Math.sin(u)*Math.sin(v);return [c[0]+x*cr-y*sr,c[1]+x*sr+y*cr,c[2]+z];};
  for(let i=0;i<NU;i++)for(let j=0;j<NV;j++){const u0=i/NU*Math.PI,u1=(i+1)/NU*Math.PI,v0=j/NV*2*Math.PI,v1=(j+1)/NV*2*Math.PI;poly([S(u0,v0),S(u1,v0),S(u1,v1),S(u0,v1)],colr,a,tag);}};
const tube=(path,r,c,a,tag)=>{for(let i=0;i<path.length-1;i++)rod(path[i],path[i+1],r,c,a,tag);};
const along=(path,t)=>{const L=[0];for(let i=1;i<path.length;i++)L.push(L[i-1]+Math.hypot(...sub(path[i],path[i-1])));const T=Math.max(0,Math.min(1,t))*L[L.length-1];let i=1;while(i<L.length-1&&L[i]<T)i++;const k=(T-L[i-1])/((L[i]-L[i-1])||1);return path[i-1].map((v,j)=>v+(path[i][j]-v)*k);};
const HR=(i,k=1)=>{const v=Math.sin(i*12.9898+k*78.233)*43758.5453;return v-Math.floor(v);};

/* ===== النبات: التراكيب والنقل ===== */
const PATH={};
const mix3=(a,b,t)=>a.map((v,j)=>v+(b[j]-v)*t);
const add=(p,d)=>[p[0]+d[0],p[1]+d[1],p[2]+d[2]];
const mul=(p,k)=>p.map(v=>v*k);
const norm=v=>{const n=Math.hypot(...v)||1;return v.map(a=>a/n);};
const VIEWS={plant:{n:'🌱 النبات كاملًا',cam:{t:[0,.45,0],dist:6.6,pitch:.22}},root:{n:'🔍 مقطع الجذر',cam:{t:[0,-.1,0],dist:5.0,pitch:.38}},stem:{n:'🔍 مقطع الساق',cam:{t:[0,0,0],dist:4.7,pitch:.42}},leaf:{n:'🔍 مقطع الورقة',cam:{t:[0,.05,0],dist:4.9,pitch:-.32}}};
const ORG={
 root:{n:'الجذر',v:'plant',g:'root',d:'جزء من النبات يثبّت النبات في التربة، ويخزن الغذاء، ويمتص الماء والمواد المغذية من التربة عن طريق الشعيرات الجذرية.',at:{plant:[.05,-1.0,0]}},
 hairs:{n:'الشعيرات الجذرية',v:'root',g:'root',d:'تتفرّع من الجذر، وتعمل على زيادة مساحة سطح الجذور؛ فتسمح للنبات بامتصاص كميات أكبر من الماء والأملاح.',at:{plant:[.55,-1.05,.1],root:[.95,.1,.3]}},
 cap:{n:'القلنسوة',v:'root',g:'root',d:'طبقة قاسية تحمي قمّة الجذور، وتسمح لها باختراق التربة.',at:{plant:[.05,-1.78,0],root:[0,-1.35,0]}},
 repi:{n:'بشرة الجذر',v:'root',g:'root',d:'الطبقة الخارجية للجذر، وتتفرّع منها الشعيرات الجذرية.',at:{root:[.5,.6,.45]}},
 cortex:{n:'القشرة',v:'root',g:'root',d:'طبقة تلي البشرة، يمرّ خلالها الماء والأملاح من الشعيرات الجذرية إلى الخشب.',at:{root:[-.3,1.0,.3]}},
 rxy:{n:'الخشب في الجذر',v:'root',g:'root',d:'أوعية النقل في مركز الجذر؛ ينتقل فيها الماء والأملاح إلى الساق.',at:{root:[0,1.0,0]}},
 stem:{n:'الساق',v:'plant',g:'stem',d:'تُبقي النبات محافظًا على قوامه، وتحمل الأوراق، وتنقل الماء والغذاء بين أجزاء النبات.',at:{plant:[0,1.0,0]}},
 outer:{n:'الطبقة الخارجية للساق',v:'stem',g:'stem',d:'في الساق اللينة طرية خضراء، أمّا الساق الخشبية فتحميها طبقة قاسية من القلف.',at:{stem:[-.8,.4,.35]}},
 phloem:{n:'اللحاء',v:'stem',g:'stem',d:'ينقل الغذاء من الأوراق إلى أسفل وإلى سائر أجزاء النبات.',at:{stem:[-.5,.8,-.5]}},
 cambium:{n:'الكامبيوم',v:'stem',g:'stem',d:'طبقة من الخلايا تفصل بين الخشب واللحاء.',at:{stem:[.0,.8,-.64]}},
 xylem:{n:'الخشب',v:'stem',g:'stem',d:'ينقل الماء والأملاح المعدنية من التربة إلى أعلى.',at:{stem:[.3,.8,-.2]}},

const TL=k=>TOURS[k];

function drawTour(){const T=S.tour;if(!T)return;const st=TL(T.k)[T.i],u=Math.min(1,(performance.now()-T.t0)/1000/(st.dur/(reduce?4:1)));
  if(st.d){const p=st.d(u,performance.now()/1000);S.focus=p;S.flash=new Set(st.o);if(p)label(p,st.n);T.u=u;const nb=$('#tnx');if(nb){const ready=u>=1;if(nb.disabled===ready)nb.disabled=!ready;}return;}
  let p=alongI(PATH.food,st.a+(st.b-st.a)*u);if(st.out)p=[p[0],p[1]-u*.4,p[2]];
  if(st.a===st.b){p=[p[0],p[1],p[2]+Math.sin(u*30)*.015];}
  if(st.f==='lump'){const r=st.o==='mouth'?.12-u*.04:.08;ball(p,r,'#9C6B3E',1);}
  else if(st.f==='pieces'){const sp=.04+u*.08;for(let k=0;k<6;k++)ball([p[0]+(HR(k,1)-.5)*sp*2,p[1]+(HR(k,2)-.5)*sp*2,p[2]+.05],.05-u*.015,'#B07A45',1);}
  else if(st.f==='fine'){for(let k=0;k<8;k++)ball([p[0]+(HR(k,3)-.5)*.14,p[1]+(HR(k,4)-.5)*.1,p[2]+.05],.025,'#C98B4E',1);}
  else ball(p,.06,'#6B5A45',st.out?1-u*.7:1);
  if(st.juice){for(let k=0;k<4;k++){const q=(u*2+k*.25)%1,a=[.2,.92,-.08],b=alongI(PATH.food,9);ball([a[0]+(b[0]-a[0])*q,a[1]+(b[1]-a[1])*q,a[2]+(b[2]-a[2])*q+.04],.03,'#7FD36A',1);}}
  if(st.absorb){const v=[-.04,.6,-.26];for(let k=0;k<5;k++){const q=(u*4+k*.2)%1,a=alongI(PATH.food,st.a+(st.b-st.a)*Math.max(0,u-.05*k));ball([a[0]+(v[0]-a[0])*q,a[1]+(v[1]-a[1])*q,a[2]+(v[2]-a[2])*q],.035,'#F2C230',1);}
    const bv=alongI(PATH.artBody,3+u);ball(bv,.04,'#F2C230',1);}
  S.focus=p;S.flash=new Set(st.o==='pancreas'?['pancreas','liver']:[st.o]);label(p,st.n);T.u=u;
  const nb=$('#tnx');if(nb){const ready=u>=1;if(nb.disabled===ready)nb.disabled=!ready;}}
function tourUI(){const T=S.tour,L=TL(T.k),st=L[T.i],w=$('#watch');const last=T.i===L.length-1;
  w.innerHTML=`<div class="tstep"><span class="tno">${ar(T.i+1)}/${ar(L.length)}</span><b>${st.n}</b></div>
   <p class="ttx">${st.t}</p><p class="tfd">${st.x||('🍞 '+st.food)}</p>
   <div class="tnav"><button class="tb" type="button" id="tpv" ${T.i?'':'disabled'} aria-label="الخطوة السابقة">→ السابق</button><button class="tb rp" type="button" id="trp" aria-label="أعد هذه الخطوة">↺</button>
   ${last?`<button class="tb go2" type="button" id="tq">إلى السؤال ←</button>`:`<button class="tb go2" type="button" id="tnx" disabled>التالي ←</button>`}</div>`;
  $('#tpv').onclick=()=>tourGo(T.i-1);$('#trp').onclick=()=>tourGo(T.i);if(last)$('#tq').onclick=()=>{S.tour=null;S.flash=null;pane(3);};else $('#tnx').onclick=()=>tourGo(T.i+1);}
function tourGo(i){S.tour={k:S.tour?S.tour.k:'food',i,t0:performance.now()};S.anim=null;tourUI();}
function startTour(k){S.sel=null;nav();pane(2);mini(false);S.tour={k,i:0,t0:performance.now()};tourGo(0);}

  ohint:['ابدأ من التربة: أين يدخل الماء إلى النبات أولًا؟','بعد أن يصل الماء إلى خشب الجذر، كيف يصعد؟','بعد أن يصعد الماء في الساق، أين يذهب؟','ماذا تفعل خلايا الورقة بالماء؟'],
  q:'أقرأ الشكل (من الكتاب): كيف ينتقل الماء من جذور النبات إلى ساقه؟',o:['عبر الخشب إلى أعلى؛ إذ يسحبه النتح نحو الأوراق','عبر اللحاء من الأوراق إلى أسفل','عبر الثغور الموجودة في الأوراق'],c:0,
  h:{1:'اللحاء ينقل الغذاء، لا الماء.',2:'الثغور في الأوراق يخرج منها بخار الماء، ولا تتصل بالجذر مباشرة.'},
  rule:'<b>انتقال الماء</b>عندما تمتص الجذور الماء يزداد الضغط داخل الجذر، ويندفع الماء في الساق في اتجاه الأوراق. وخلال عملية النتح تقوم النباتات بإخراج الماء إلى الغلاف الجوي عن طريق الأوراق، وكلّما فقد النبات الماء عن طريق النتح؛ انتقل الماء من الجذور إلى الساق عبر الخشب، ثم إلى الأوراق.'},
 {t:'رحلة الغذاء',k:'المهمة ٥ · البناء الضوئي ونقل الغذاء',view:'leaf',intro:'كيف تصنع الورقة الغذاء؟ وكيف يصل إلى الجذور؟ شغّل الرحلة وراقب.',anim:'sugar',
  q:'كيف يصل السكر المتكوّن في الأوراق إلى الجذور؟',o:['ينتقل عبر اللحاء إلى السيقان ثم إلى الجذور','ينتقل عبر الخشب من الأوراق إلى الجذور','تمتصه الشعيرات الجذرية من التربة'],c:0,
  h:{1:'الخشب ينقل الماء في اتجاه واحد فقط: من الجذور إلى أعلى.',2:'الشعيرات الجذرية تمتص الماء والأملاح، أمّا السكر فيُصنع في الأوراق.'},
  rule:'<b>البناء الضوئي</b>البناء الضوئي عملية يُستخدم فيها ضوء الشمس لإنتاج الغذاء في صورة سكر الجلوكوز، وتحدث في البلاستيدات الخضراء:<br><span dir="rtl">ثاني أكسيد الكربون + ماء ←(ضوء الشمس)— غذاء (سكر جلوكوز) + الأكسجين</span><br>يبقى بعض الجلوكوز في الأوراق، وينتقل الباقي عبر اللحاء إلى السيقان والجذور؛ حيث يُستخدم جزء منه في العمليات الحيوية، ويَخزُن النبات الباقي.'}];
const done=new Set();
function viewUI(){const el=$('#sys');el.innerHTML=Object.entries(VIEWS).map(([k,v])=>`<button type="button" data-v="${k}" class="${S.view===k?'on':''}" aria-pressed="${S.view===k}">${v.n}</button>`).join('')+(S.view==='stem'?`<button type="button" id="wd" class="sub ${S.woody?'on':''}" aria-pressed="${!!S.woody}">${S.woody?'🪵 ساق خشبية':'🌿 ساق لينة'} ⇄</button>`:'');
  el.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{setView(b.dataset.v);});const w=$('#wd');if(w)w.onclick=()=>{S.woody=S.woody?0:1;viewUI();};
  $('#cv').setAttribute('aria-label',{plant:'نبات ثلاثي الأبعاد بجذوره وساقه وأوراقه',root:'مقطع مكبّر ثلاثي الأبعاد لجذر',stem:'مقطع مكبّر ثلاثي الأبعاد لساق',leaf:'مقطع مكبّر ثلاثي الأبعاد لورقة'}[S.view]);}
function nav(){$('#ms').innerHTML=MS.map((m,i)=>`<button type="button" data-m="${i}" class="${i===S.mi?'on':''} ${done.has(i)?'done':''}">${done.has(i)?'✓ ':''}${m.t}</button>`).join('');$('#ms').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>open(+b.dataset.m));viewUI();}
const toast=t=>{const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,2600);};
let seqI=0,ordI=0;
function open(i){S.tour=null;S.mi=i;S.sel=null;S.flash=null;S.anim=null;seqI=0;ordI=0;S.woody=0;S.water=.8;const m=MS[i],c=$('#cin');
  if(m.explore){nav();renderExplore();return;}
  setView(m.view);if(m.find)S.excFound=new Set();nav();
  let task='';if(m.seq)task=`<p class="step">١. اضغط على الأجزاء بالترتيب في المجسّم:</p><div class="seq" id="sq">${m.seq.map((k,j)=>`<span>${ar(j+1)}</span>`).join('')}</div><p class="fb" id="sf"></p>`;
  else if(m.order)task=`<p class="step">١. رتّب الخطوات (اضغط بالترتيب):</p><div class="opts" id="od">${m.mix.map(j=>`<button class="opt" type="button" data-o="${j}">${m.order[j]}</button>`).join('')}</div><div class="seq" id="sq">${m.order.map((_,j)=>`<span>${ar(j+1)}</span>`).join('')}</div><p class="fb" id="sf"></p>`;
  else if(m.find)task=`<p class="step">١. اضغط على التركيبين في المجسّم:</p><div class="chips" id="fd">${m.find.map(k=>`<span data-f="${k}">؟</span>`).join('')}</div><p class="fb" id="sf"></p>`;
  else if(m.slider==='water')task=`<label class="step" for="wsl">كمية الماء في النبات:</label><input id="wsl" type="range" min="0" max="100" value="80" style="width:100%;direction:ltr;accent-color:var(--accent)"><div class="ends"><span>ماء قليل</span><span>ماء كثير</span></div><p class="fb" id="sf"></p>`;
  else task=`<p class="step">١. شغّل الرحلة وراقب.</p><button class="go" type="button" id="play">▶ شغّل</button>`;
  c.innerHTML=`<div class="hd"><div><p class="kick">${m.k}</p><h2>${m.t}</h2></div><button class="tg" type="button" id="mn" aria-label="تصغير البطاقة">▾</button></div>
   <div class="dots" id="dt"></div>
   <div class="pane" id="p1"><p class="lead">${m.intro}</p>${task}</div>
   <div class="pane" id="watch" hidden><p class="step">راقب الرحلة في المجسّم 👀</p><button class="go full" type="button" id="replay">↺ أعد الرحلة</button></div>
   <div class="pane" id="qq" hidden><p class="step">${m.q}</p><div class="opts">${m.o.map((o,k)=>`<button class="opt" type="button" data-q="${k}">${o}</button>`).join('')}</div><p class="fb" id="qf"></p><button class="go full" type="button" id="replay2" style="background:transparent;color:var(--accent);border:1.5px solid var(--accent)">↺ شاهد الرحلة مرة أخرى</button></div>
   <div class="pane" id="rr" hidden><p class="fb ok">✓ صحيح!</p><p class="rule">${m.rule}</p>${i<MS.length-1?`<button class="go" type="button" id="nx">المهمة التالية ←</button>`:`<p class="small">أنهيت المهام. انتقل إلى «استكشف» لتراجع التراكيب ووظائفها.</p>`}</div>
   <p class="src">📖 الكتاب ص٨٠–٨٣</p>`;
  pane(1);$('#mn').onclick=()=>mini(!$('.card').classList.contains('mini'));
  if(m.order)c.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const j=+b.dataset.o;const f=$('#sf');if(j===ordI){b.disabled=true;b.classList.add('right');const sp=$('#sq').children[ordI];sp.className='f';sp.textContent=ar(ordI+1)+' ✓';ordI++;f.className='fb ok';f.textContent=ordI===m.order.length?'أحسنت! رتّبت رحلة الماء. شاهدها الآن.':'صحيح.';if(ordI===m.order.length)startAnim();}
    else{b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),700);f.className='fb bad';f.textContent=(j>ordI?'هذه الخطوة تأتي لاحقًا. ':'')+m.ohint[ordI];}});
  if(m.slider==='water'){const seen=new Set();$('#wsl').oninput=e=>{const v=+e.target.value/100;S.water=v;const f=$('#sf');f.className='fb';f.innerHTML=v>.7?'ماء كثير: الخليتان الحارستان <b>منتفختان</b>، والثغر <b>مفتوح</b>؛ يخرج بخار الماء (النتح).':v<.25?'ماء قليل: الخليتان الحارستان <b>منكمشتان</b>، والثغر <b>مغلق</b>؛ فيمنع خروج الماء.':'راقب الخليتين الحارستين…';if(v>.9)seen.add('h');if(v<.1)seen.add('l');if(seen.size===2&&!seen.ok){seen.ok=1;f.className='fb ok';f.textContent='أحسنت! لاحظت فتح الثغر وإغلاقه. شاهد الآن رحلة الورقة.';startAnim();}};mini(false);}
  if($('#play'))$('#play').onclick=()=>{$('#play').disabled=true;startAnim();};
  $('#replay').onclick=()=>startTour(m.anim);$('#replay2').onclick=()=>startTour(m.anim);
  c.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const k=+b.dataset.q,f=$('#qf');if(k===m.c){b.classList.add('right');c.querySelectorAll('[data-q]').forEach(x=>x.disabled=true);done.add(i);nav();pane(4);const nx=$('#nx');if(nx)nx.onclick=()=>open(i+1);}
    else{b.classList.add('wrong');b.disabled=true;f.className='fb bad';f.textContent=m.h[k]||'شاهد الرحلة مرة أخرى.';}});}
function startAnim(){const m=MS[S.mi];const k=m.anim;setTimeout(()=>{if(MS[S.mi]===m)startTour(k);},700);}

const SMALL=()=>W<900;
function mini(on){const c=$('.card');c.classList.toggle('mini',!!on);const b=$('#mn');if(b){b.textContent=on?'▴':'▾';b.setAttribute('aria-label',on?'تكبير البطاقة':'تصغير البطاقة');}}
function pane(n){const m=MS[S.mi];['p1','watch','qq','rr'].forEach((id,k)=>{const e=$('#'+id);if(e)e.hidden=k+1!==n;});
  const lab=['أنفّذ','أراقب','أستنتج','القاعدة'];$('#dt').innerHTML=lab.map((l,k)=>`<i class="${k+1<n?'d':k+1===n?'c':''}"></i>`).join('')+`<span>${ar(n)}/٤ · ${lab[n-1]}</span>`;
  const bodyTask=(n===2&&!TL(m.anim||''))||(n===1&&(m.seq||m.find));mini(SMALL()&&bodyTask);$('.cin').scrollTop=0;}

function renderExplore(){const c=$('#cin');const all=Object.keys(ORG);mini(false);
  c.innerHTML=`<p class="kick">استكشاف حر</p><h2>تراكيب النبات</h2><p class="lead">${S.sel?'':'اضغط على أي جزء في المجسّم لتعرف اسمه ووظيفته. الأزرار في الأعلى تكبّر مقطع الجذر أو الساق أو الورقة.'}</p>
   ${S.sel?`<p class="info"><b>${ORG[S.sel].n}</b>${ORG[S.sel].d}</p>`:''}
   <p class="small">اضغط على جزء في المجسّم، أو على اسمه هنا. اكتشفت <b>${ar(S.seen.size)}</b> من ${ar(all.length)}.</p>
   <div class="olist">${Object.entries(GRP).map(([gk,gv])=>`<div class="ogrp"><b><i style="background:${gv.c}"></i>${gv.n}</b><div class="chips">${all.filter(k=>ORG[k].g===gk).map(k=>`<button type="button" class="obtn ${S.sel===k?'sel':S.seen.has(k)?'got':''}" data-org="${k}">${S.seen.has(k)?'✓ ':''}${ORG[k].n}</button>`).join('')}</div></div>`).join('')}</div><button class="go full" type="button" id="st1">ابدأ «الجذر» ←</button>
   <p class="src">📖 الكتاب ص٨٠–٨٣</p>`;$('#st1').onclick=()=>open(1);
  c.querySelectorAll('[data-org]').forEach(b=>b.onclick=()=>{const k=b.dataset.org;if(!ORG[k].at[S.view])setView(ORG[k].v);S.sel=k;S.seen.add(k);renderExplore();c.scrollTop=0;});}
/* الضغط */
function tagAt(x,y){const inP=(p)=>{let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){if(((p[i][1]>y)!==(p[j][1]>y))&&(x<(p[j][0]-p[i][0])*(y-p[i][1])/(p[j][1]-p[i][1])+p[i][0]))c=!c;}return c;};
  const dS=(a,b)=>{const vx=b[0]-a[0],vy=b[1]-a[1],t=Math.max(0,Math.min(1,((x-a[0])*vx+(y-a[1])*vy)/((vx*vx+vy*vy)||1)));return Math.hypot(x-a[0]-vx*t,y-a[1]-vy*t);};
  const LOW={blade:1,root:1,repi:1,cortex:1,outer:1,uepi:1,lepi:1,cuticle:1};let low=null;for(let i=HIT.length-1;i>=0;i--){const h=HIT[i];const ok=h.poly?inP(h.poly):h.c?Math.hypot(x-h.c[0],y-h.c[1])<h.c[2]:dS(h.seg[0],h.seg[1])<h.seg[2];if(!ok)continue;if(LOW[h.tag]){if(!low||LOW[h.tag]>LOW[low])low=h.tag;continue;}return h.tag;}return low;}
function tap(x,y){const k=tagAt(x,y);if(!k)return;const m=MS[S.mi];
  if(m.explore){S.sel=k;S.seen.add(k);renderExplore();$('#cin').scrollTop=0;return;}
  S.sel=k;
  if(m.seq&&seqI<m.seq.length){const f=$('#sf');if(k===m.seq[seqI]){const sp=$('#sq').children[seqI];sp.className='f';sp.textContent=ORG[k].n;seqI++;f.className='fb ok';f.textContent='صحيح: '+ORG[k].n+' — '+ORG[k].d;if(seqI===m.seq.length){f.textContent='أحسنت! حدّدت الأجزاء الثلاثة. شاهد الرحلة.';startAnim();}}
    else{f.className='fb bad';f.textContent=ORG[k].n+': '+ORG[k].d+' المطلوب الآن غيره. تلميح: '+m.hint[m.seq[seqI]];}}
  else if(m.find){const f=$('#sf');if(m.find.includes(k)&&!S.excFound.has(k)){S.excFound.add(k);const sp=$('#fd').querySelector(`[data-f="${k}"]`);sp.className='got';sp.textContent='✓ '+ORG[k].n;f.className='fb ok';f.textContent=ORG[k].n+': '+ORG[k].d;if(S.excFound.size===m.find.length){f.textContent+=' وجدتهما كليهما!';startAnim();}}
    else if(!m.find.includes(k)){const need=m.find.find(q=>!S.excFound.has(q));f.className='fb bad';f.textContent=ORG[k].n+': '+ORG[k].d+' ليس هذا المطلوب. تلميح: '+m.hint[need];}}}
const ptr=new Map();let moved=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;});
cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const [px,py]=ptr.get(e.pointerId);const dx=e.clientX-px,dy=e.clientY-py;moved+=Math.abs(dx)+Math.abs(dy);ptr.set(e.pointerId,[e.clientX,e.clientY]);cam.yaw-=dx*.008;cam.pitch=Math.max(-.9,Math.min(1.1,cam.pitch+dy*.006));S.drag=performance.now();});
cv.addEventListener('pointerup',e=>{ptr.delete(e.pointerId);if(moved<6)tap(e.clientX,e.clientY);});cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
let ZF=1;cv.addEventListener('wheel',e=>{e.preventDefault();ZF=Math.max(.55,Math.min(1.8,ZF*(1+Math.sign(e.deltaY)*.07)));},{passive:false});
let lastV='';
/* الحلقة */
function frame(ms){place();const k=reduce?1:.06;if(lastV!==S.view){lastV=S.view;S.vt=performance.now();ZF=1;}
  const fresh=performance.now()-(S.vt||0)<1500;
  for(let j=0;j<3;j++)cam.t[j]+=(camT.t[j]-cam.t[j])*k;
  if(S.tour&&S.focus&&W<900){const ty=Math.max(camT.t[1]-.9,Math.min(camT.t[1]+.9,S.focus[1]*.5+camT.t[1]*.5));cam.t[1]+=(ty-cam.t[1])*k;}
  cam.dist+=(camT.dist*ZF-cam.dist)*k;if(fresh&&!(S.drag&&performance.now()-S.drag<300))cam.pitch+=(camT.pitch-cam.pitch)*k;
  cx.setTransform(DPR,0,0,DPR,0,0);const g=cx.createRadialGradient(CX0,CY0,50,CX0,CY0,Math.max(W,H));g.addColorStop(0,'#24382C');g.addColorStop(1,'#0B130E');cx.fillStyle=g;cx.fillRect(0,0,W,H);
  const idle=!S.drag||performance.now()-S.drag>2500;if(idle&&!reduce)cam.yaw+=(Math.sin(ms/4000)*.45-cam.yaw)*.01;
  const t=ms/1000;({plant:plantModel,root:rootModel,stem:stemModel,leaf:leafModel})[S.view](t);
  if(S.view==='leaf'&&!S.tour&&S.water>.4){vapor([STX,Y_LE0-.05,STZ],t*.5*S.water,3);}
  drawTour();if(S.sel&&ORG[S.sel]&&ORG[S.sel].at[S.view])label(AT(S.sel),ORG[S.sel].n);
  flush();requestAnimationFrame(frame);}

/* سحب البطاقة */
(()=>{const g=$('#grip'),card=$('.card');let d=null;
  const clamp=(x,y)=>{const r=card.getBoundingClientRect();return [Math.max(4,Math.min(innerWidth-r.width-4,x)),Math.max(4,Math.min(innerHeight-60,y))];};
  g.addEventListener('pointerdown',e=>{g.setPointerCapture(e.pointerId);const r=card.getBoundingClientRect();d={dx:e.clientX-r.left,dy:e.clientY-r.top,w:r.width,moved:0};});
  g.addEventListener('pointermove',e=>{if(!d)return;d.moved++;if(!card.classList.contains('moved')){card.classList.add('moved');card.style.width=d.w+'px';card.style.insetInline='auto';card.style.right='auto';card.style.bottom='auto';}
    card.classList.add('drag');const [x,y]=clamp(e.clientX-d.dx,e.clientY-d.dy);card.style.left=x+'px';card.style.top=y+'px';});
  const end=()=>{d=null;card.classList.remove('drag');};g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
  const reset=()=>{card.classList.remove('moved');['width','insetInline','right','bottom','left','top'].forEach(k=>card.style[k]='');};
  g.addEventListener('dblclick',reset);
  g.addEventListener('keydown',e=>{const st={ArrowUp:[0,-20],ArrowDown:[0,20],ArrowLeft:[-20,0],ArrowRight:[20,0]}[e.key];if(e.key==='Escape'){reset();return;}if(!st)return;e.preventDefault();const r=card.getBoundingClientRect();
    if(!card.classList.contains('moved')){card.classList.add('moved');card.style.width=r.width+'px';card.style.insetInline='auto';card.style.right='auto';card.style.bottom='auto';}const [x,y]=clamp(r.left+st[0],r.top+st[1]);card.style.left=x+'px';card.style.top=y+'px';});
  addEventListener('resize',()=>{if(card.classList.contains('moved')){const r=card.getBoundingClientRect();const [x,y]=clamp(r.left,r.top);card.style.left=x+'px';card.style.top=y+'px';}});})();
open(0);requestAnimationFrame(frame);
})();
</script>
